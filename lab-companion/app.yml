version: 2

name: LAB_COMPANION
database: BARCLAYS_HOL
schema: LAB
query_warehouse: BARCLAYS_WH

label: "Payments HOL Lab Companion"
description: "Guided pathways for the Barclays Payments Operations hands-on lab, with live Check my work validation and facilitator progress."
icon: public/icon.svg

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - "*.tsbuildinfo"
