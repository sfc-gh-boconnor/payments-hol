ws and AI agents - and that people only\n--            see the clients in their region.\"\n-- Prereq:   setup/catchup/core_analytics.sql (STG_ACCOUNTS, STG_CUSTOMERS)\n-- Uses:     HOL_RESTRICTED role (granted to HOL_PARTICIPANT) to test as a consumer\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.GOVERNANCE;\n\n-- Reset (makes this script safe to run first time and to re-run)\nCREATE TAG IF NOT EXISTS DATA_SENSITIVITY;\nCREATE MASKING POLICY IF NOT EXISTS MASK_RESTRICTED_STRING AS (VAL STRING) RETURNS STRING -> VAL;\nALTER TAG DATA_SENSITIVITY UNSET MASKING POLICY MASK_RESTRICTED_STRING;\nDROP TABLE IF EXISTS ACCOUNT_REGISTER;\n\n-- -----------------------------------------------------\n-- GOV1.1 Let Snowflake find the sensitive data\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE ACCOUNT_REGISTER AS\nSELECT * FROM BARCLAYS_HOL.ANALYTICS.STG_ACCOUNTS;   -- governed copy we own, for the lab\n\nCALL SYSTEM$CLASSIFY('BARCLAYS_HOL.GOVERNANCE.ACCOUNT_REGISTER', {'auto_tag': true});\n\nSELECT COLUMN_NAME, TAG_NAME, TAG_VALUE\nFROM TABLE(BARCLAYS_HOL.INFORMATION_SCHEMA.TAG_REFERENCES_ALL_COLUMNS(\n        'BARCLAYS_HOL.GOVERNANCE.ACCOUNT_REGISTER', 'table'))\nORDER BY COLUMN_NAME;\n\n-- -----------------------------------------------------\n-- GOV1.2 The bank's own tag taxonomy\n-- -----------------------------------------------------\nCREATE OR REPLACE TAG DATA_SENSITIVITY\n    ALLOWED_VALUES 'PUBLIC', 'INTERNAL', 'CONFIDENTIAL', 'RESTRICTED'\n    COMMENT = 'Barclays-style data sensitivity classification';\n\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN IBAN           SET TAG DATA_SENSITIVITY = 'RESTRICTED';\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN ACCOUNT_NUMBER SET TAG DATA_SENSITIVITY = 'RESTRICTED';\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN SORT_CODE      SET TAG DATA_SENSITIVITY = 'CONFIDENTIAL';\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN BIC            SET TAG DATA_SENSITIVITY = 'INTERNAL';\n\n-- -----------------------------------------------------\n-- GOV1.3 Tag-based masking: protect every column carrying the tag, now and in future\n-- -----------------------------------------------------\nCREATE OR REPLACE MASKING POLICY MASK_RESTRICTED_STRING AS (VAL STRING) RETURNS STRING ->\n    CASE\n        WHEN IS_ROLE_IN_SESSION('HOL_ADMIN') THEN VAL                              -- data owner\n        WHEN SYSTEM$GET_TAG_ON_CURRENT_COLUMN('BARCLAYS_HOL.GOVERNANCE.DATA_SENSITIVITY') = 'CONFIDENTIAL'\n             THEN REGEXP_REPLACE(VAL, '[0-9]', '*')                                 -- shape kept, digits hidden\n        WHEN VAL IS NULL THEN NULL\n        ELSE '****' || RIGHT(VAL, 4)                                               -- last 4 only\n    END\n    COMMENT = 'Masks RESTRICTED/CONFIDENTIAL strings for everyone except the data owner';\n\nALTER TAG DATA_SENSITIVITY SET MASKING POLICY MASK_RESTRICTED_STRING;\n-- Note: the policy applies to every tagged value; INTERNAL and PUBLIC columns\n-- fall through to last-4 here - refine the CASE for your own taxonomy.\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN BIC UNSET TAG DATA_SENSITIVITY;\n\n-- -----------------------------------------------------\n-- GOV1.4 Row access: users only see clients for their region\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE REGION_ENTITLEMENTS (ROLE_NAME STRING, CURRENCY STRING);\nINSERT INTO REGION_ENTITLEMENTS VALUES\n    ('HOL_RESTRICTED', 'GBP');      -- UK desk: sterling accounts only\n\nCREATE OR REPLACE ROW ACCESS POLICY RAP_ACCOUNT_REGION AS (ACCT_CURRENCY STRING) RETURNS BOOLEAN ->\n    IS_ROLE_IN_SESSION('HOL_PARTICIPANT')   -- lab builders see all\n    OR EXISTS (SELECT 1 FROM BARCLAYS_HOL.GOVERNANCE.REGION_ENTITLEMENTS e\n               WHERE IS_ROLE_IN_SESSION(e.ROLE_NAME) AND e.CURRENCY = ACCT_CURRENCY);\n\nALTER TABLE ACCOUNT_REGISTER ADD ROW ACCESS POLICY RAP_ACCOUNT_REGION ON (CURRENCY);\n\n-- (USAGE on the GOVERNANCE schema is granted to HOL_RESTRICTED by facilitator setup)\nGRANT SELECT ON TABLE ACCOUNT_REGISTER TO ROLE HOL_RESTRICTED;\n\n-- -----------------------------------------------------\n-- GOV1.5 Test as each persona\n-- -----------------------------------------------------\n-- As the builder: all rows, but RESTRICTED values masked (not the data owner)\nSELECT ACCOUNT_ID, CUSTOMER_NAME, CURRENCY, SORT_CODE, ACCOUNT_NUMBER, IBAN\nFROM ACCOUNT_REGISTER ORDER BY ACCOUNT_ID LIMIT 8;\n\nSELECT 'HOL_PARTICIPANT' AS AS_ROLE, COUNT(*) AS VISIBLE_ACCOUNTS FROM ACCOUNT_REGISTER;\n\n-- As the restricted UK desk: GBP accounts only, masked\nUSE ROLE HOL_RESTRICTED;\nSELECT ACCOUNT_ID, CUSTOMER_NAME, CURRENCY, SORT_CODE, ACCOUNT_NUMBER, IBAN\nFROM BARCLAYS_HOL.GOVERNANCE.ACCOUNT_REGISTER ORDER BY ACCOUNT_ID LIMIT 8;\nSELECT 'HOL_RESTRICTED' AS AS_ROLE, COUNT(*) AS VISIBLE_ACCOUNTS FROM BARCLAYS_HOL.GOVERNANCE.ACCOUNT_REGISTER;\n\nUSE ROLE HOL_PARTICIPANT;\n\n-- -----------------------------------------------------\n-- GOV1.6 Policies follow the data into AI\n-- Ask CoCo or an agent built over ACCOUNT_REGISTER for \"the IBAN for Royal Trust PLC\":\n-- the agent runs as YOUR role, so it only ever returns the masked value.\n-- Bonus CoCo prompt:\n--   \"Show me every column in BARCLAYS_HOL tagged DATA_SENSITIVITY and the\n--    masking policy protecting it.\"\n-- -----------------------------------------------------\n\n-- Barclayflake note: in production, tag + masking policies are owned by a central\n-- governance role and applied to the Iceberg source tables themselves, so every\n-- downstream view, dbt model, semantic view and agent inherits them automatically.\n\nSELECT 'GOV1 complete' AS STATUS;\n", "sql_name": "vignettes/gov1_pii_policies/gov1.sql"}, {"code": "GOV2", "title": "Lineage, audit and trust", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Governance / Risk / Audit<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DE1 or catch-up, plus at least one agent run<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>gov2.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>If a source Iceberg table changes, what breaks? And who - human or agent - has been reading client data?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Lineage and access-history queries<\/li>\n<li>Business comments on the SLA data product<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Downstream impact of <code>RAW_DATA.PAYMENTS<\/code> with <code>GET_LINEAGE<\/code>.<\/li>\n<li>Upstream lineage of <code>MART_SLA_COMPLIANCE<\/code>.<\/li>\n<li>Access history on restricted columns.<\/li>\n<li>Query history for semantic view / agent usage.<\/li>\n<li>Document the data product.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;If I drop PROCESSING_TIME_MS from RAW_DATA.PAYMENTS, which downstream objects and agents break?&quot;<\/em><\/li>\n<li><em>&quot;Produce a one-page data product card for MART_SLA_COMPLIANCE.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>Downstream lineage lists the staging views, marts, dynamic tables and <code>SV_CLIENT_360<\/code>.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>ACCOUNT_USAGE views have up to ~3 hours latency - run history queries at the end of the session.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE GOV2: LINEAGE, AUDIT AND TRUST   (~30 min)\n-- Persona: Governance / Risk / Audit\n-- Question: \"If a source Iceberg table changes, what breaks? And who - human\n--            or AI agent - has been reading client data?\"\n-- Prereq:   Any of DE1 / catchup + at least one agent run (OPS1 or AI1)\n-- Note:     ACCOUNT_USAGE views have up to ~3 hours latency. Run the\n--           immediate checks first; revisit the history queries at the end of the day.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- GOV2.1 Impact analysis: what depends on the PAYMENTS Iceberg table? (immediate)\n-- Snowsight: Catalog > BARCLAYS_HOL > RAW_DATA > PAYMENTS > Lineage tab\n-- -----------------------------------------------------\nSELECT DISTANCE, TARGET_OBJECT_DOMAIN, TARGET_OBJECT_DATABASE || '.' || TARGET_OBJECT_SCHEMA || '.' || TARGET_OBJECT_NAME AS DOWNSTREAM_OBJECT\nFROM TABLE(SNOWFLAKE.CORE.GET_LINEAGE('BARCLAYS_HOL.RAW_DATA.PAYMENTS', 'TABLE', 'DOWNSTREAM', 3))\nORDER BY DISTANCE, DOWNSTREAM_OBJECT;\n\n-- And upstream: where does the SLA data product come from?\nSELECT DISTANCE, SOURCE_OBJECT_DOMAIN, SOURCE_OBJECT_DATABASE || '.' || SOURCE_OBJECT_SCHEMA || '.' || SOURCE_OBJECT_NAME AS UPSTREAM_OBJECT\nFROM TABLE(SNOWFLAKE.CORE.GET_LINEAGE('BARCLAYS_HOL.ANALYTICS.MART_SLA_COMPLIANCE', 'TABLE', 'UPSTREAM', 3))\nORDER BY DISTANCE, UPSTREAM_OBJECT;\n-- A row shown as ***.***.*** is an object in the lineage that your role has no\n-- privileges on (here the platform team's SEED schema). Lineage never leaks\n-- the existence of objects you are not entitled to see.\n\n-- Object dependencies (views, dynamic tables, semantic views) - immediate\nSELECT REFERENCING_OBJECT_NAME, REFERENCING_OBJECT_DOMAIN, REFERENCED_OBJECT_NAME\nFROM SNOWFLAKE.ACCOUNT_USAGE.OBJECT_DEPENDENCIES\nWHERE REFERENCED_DATABASE = 'BARCLAYS_HOL'\nORDER BY REFERENCED_OBJECT_NAME\nLIMIT 50;\n\n-- -----------------------------------------------------\n-- GOV2.2 Who accessed restricted columns? (ACCOUNT_USAGE latency applies)\n-- -----------------------------------------------------\nSELECT ah.QUERY_START_TIME, ah.USER_NAME,\n       obj.value:objectName::STRING     AS OBJECT_NAME,\n       col.value:columnName::STRING     AS COLUMN_NAME\nFROM SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY ah,\n     LATERAL FLATTEN(ah.BASE_OBJECTS_ACCESSED) obj,\n     LATERAL FLATTEN(obj.value:columns) col\nWHERE obj.value:objectName::STRING ILIKE 'BARCLAYS_HOL.%'\n  AND col.value:columnName::STRING IN ('IBAN', 'ACCOUNT_NUMBER', 'SORT_CODE')\n  AND ah.QUERY_START_TIME >= DATEADD('day', -1, CURRENT_TIMESTAMP())\nORDER BY ah.QUERY_START_TIME DESC\nLIMIT 20;\n\n-- -----------------------------------------------------\n-- GOV2.3 What are our agents doing? Every agent call is observable\n-- Snowsight: AI & ML > Agents > CORPORATE_PAYMENTS_360 > Monitoring\n-- -----------------------------------------------------\nSELECT QUERY_TYPE, USER_NAME, ROLE_NAME, START_TIME, TOTAL_ELAPSED_TIME / 1000 AS SECONDS,\n       LEFT(QUERY_TEXT, 120) AS QUERY_PREVIEW\nFROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY\nWHERE DATABASE_NAME = 'BARCLAYS_HOL'\n  AND QUERY_TEXT ILIKE '%SEMANTIC_VIEW%'\n  AND START_TIME >= DATEADD('day', -1, CURRENT_TIMESTAMP())\nORDER BY START_TIME DESC\nLIMIT 20;\n\n-- -----------------------------------------------------\n-- GOV2.4 Document the data product so humans and AI find the right thing\n-- -----------------------------------------------------\nCOMMENT ON TABLE MART_SLA_COMPLIANCE IS\n  'Daily SLA compliance per payment scheme. Owner: Payments Operations. Grain: day x scheme. Source: Iceberg RAW_DATA.PAYMENTS via dbt.';\nCOMMENT ON COLUMN MART_SLA_COMPLIANCE.SLA_STATUS IS\n  'COMPLIANT = met success-rate and P95 targets; AT RISK = within 5% of success target; BREACH = otherwise';\n\n-- Ask CoCo:\n--   \"If I drop column PROCESSING_TIME_MS from BARCLAYS_HOL.RAW_DATA.PAYMENTS,\n--    which downstream objects and agents break? Use lineage to check.\"\n--   \"Produce a one-page data product card for MART_SLA_COMPLIANCE: owner, grain,\n--    lineage, quality checks, sensitivity tags and consumers.\"\n\n-- Barclayflake note: Trust Center and Horizon Catalog surface the same lineage,\n-- classification and access history centrally for the CDO / data office.\n\nSELECT 'GOV2 complete' AS STATUS;\n", "sql_name": "vignettes/gov2_lineage_audit/gov2.sql"}, {"code": "core_analytics", "title": "Catch-up: core analytics", "body": "<p>Run this if a vignette lists it as a prerequisite and you have not built it yet.<\/p>", "sql": "-- =====================================================\n-- BARCLAYS PAYMENTS HOL v2 - CATCH-UP SCRIPT\n-- CORE ANALYTICS LAYER (pure SQL equivalent of the dbt project + AI enrichment)\n--\n-- Run this if your chosen vignette needs the analytics layer and you have\n-- not completed DE1 (dbt) / DA2 (AI enrichment). Safe to re-run.\n-- Objects match dbt/models exactly so later vignettes behave the same.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- ---------- Staging views ----------\nCREATE OR REPLACE VIEW STG_PAYMENTS AS\nSELECT\n    PAYMENT_ID,\n    PAYMENT_DATE::TIMESTAMP                             AS PAYMENT_DATE,\n    DATE_TRUNC('DAY', PAYMENT_DATE::TIMESTAMP)          AS PAYMENT_DAY,\n    ORIGINATOR_ACCOUNT_ID,\n    BENEFICIARY_ACCOUNT_ID,\n    UPPER(TRIM(PAYMENT_TYPE))                           AS PAYMENT_TYPE,\n    UPPER(TRIM(CHANNEL))                                AS CHANNEL,\n    UPPER(TRIM(CURRENCY))                               AS CURRENCY,\n    AMOUNT::NUMBER(15,2)                                AS AMOUNT,\n    FX_RATE,\n    UPPER(TRIM(STATUS))                                 AS STATUS,\n    PROCESSING_TIME_MS::NUMBER                          AS PROCESSING_TIME_MS,\n    ERROR_CODE,\n    UPPER(TRIM(REGION))                                 AS REGION,\n    SETTLEMENT_DATE,\n    CASE WHEN STATUS = 'COMPLETED' THEN TRUE ELSE FALSE END  AS IS_SUCCESSFUL,\n    CASE WHEN STATUS = 'FAILED'    THEN TRUE ELSE FALSE END  AS IS_FAILED,\n    CASE WHEN ERROR_CODE IS NOT NULL THEN TRUE ELSE FALSE END AS HAS_ERROR\nFROM BARCLAYS_HOL.RAW_DATA.PAYMENTS;\n\nCREATE OR REPLACE VIEW STG_FEEDBACK AS\nSELECT\n    FEEDBACK_ID,\n    FEEDBACK_DATE::TIMESTAMP            AS FEEDBACK_DATE,\n    DATE_TRUNC('DAY', FEEDBACK_DATE)    AS FEEDBACK_DAY,\n    CUSTOMER_ID,\n    PAYMENT_ID,\n    UPPER(TRIM(FEEDBACK_CHANNEL))       AS FEEDBACK_CHANNEL,\n    TRIM(FEEDBACK_TEXT)                 AS FEEDBACK_TEXT,\n    UPPER(TRIM(PAYMENT_TYPE))           AS PAYMENT_TYPE,\n    RATING::NUMBER(1)                   AS RATING,\n    LENGTH(TRIM(FEEDBACK_TEXT))         AS FEEDBACK_LENGTH,\n    CASE WHEN RATING >= 4 THEN 'SATISFIED'\n         WHEN RATING = 3  THEN 'NEUTRAL'\n         ELSE 'DISSATISFIED' END        AS SATISFACTION_TIER\nFROM BARCLAYS_HOL.RAW_DATA.CUSTOMER_FEEDBACK\nWHERE FEEDBACK_TEXT IS NOT NULL AND LENGTH(TRIM(FEEDBACK_TEXT)) > 0;\n\nCREATE OR REPLACE VIEW STG_CUSTOMERS AS\nSELECT\n    c.CUSTOMER_ID,\n    UPPER(TRIM(c.CUSTOMER_NAME))        AS CUSTOMER_NAME,\n    UPPER(TRIM(c.SECTOR))               AS SECTOR,\n    c.COUNTRY,\n    c.ONBOARDING_DATE,\n    UPPER(TRIM(c.KYC_STATUS))           AS KYC_STATUS,\n    c.RM_ID,\n    r.RM_NAME,\n    r.TEAM                              AS RM_TEAM,\n    r.REGION                            AS RM_REGION\nFROM BARCLAYS_HOL.RAW_DATA.CUSTOMERS c\nLEFT JOIN BARCLAYS_HOL.RAW_DATA.RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID;\n\nCREATE OR REPLACE VIEW STG_ACCOUNTS AS\nSELECT\n    a.ACCOUNT_ID, a.CUSTOMER_ID, a.SORT_CODE, a.ACCOUNT_NUMBER, a.IBAN, a.BIC,\n    UPPER(TRIM(a.CURRENCY))             AS CURRENCY,\n    UPPER(TRIM(a.ACCOUNT_TYPE))         AS ACCOUNT_TYPE,\n    UPPER(TRIM(a.STATUS))               AS STATUS,\n    a.OPENED_DATE,\n    c.CUSTOMER_NAME,\n    c.SECTOR                            AS CUSTOMER_SECTOR\nFROM BARCLAYS_HOL.RAW_DATA.ACCOUNTS a\nLEFT JOIN BARCLAYS_HOL.RAW_DATA.CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID;\n\n-- ---------- Marts ----------\nCREATE OR REPLACE TABLE MART_PAYMENT_KPIS AS\nSELECT\n    p.PAYMENT_DAY, p.PAYMENT_TYPE, p.REGION, p.CHANNEL,\n    c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME, c.RM_TEAM,\n    COUNT(*)                                                   AS TOTAL_PAYMENTS,\n    SUM(p.AMOUNT)                                              AS TOTAL_VOLUME_GBP,\n    ROUND(AVG(p.AMOUNT), 2)                                    AS AVG_PAYMENT_AMOUNT,\n    COUNT(CASE WHEN p.IS_SUCCESSFUL THEN 1 END)                AS SUCCESSFUL_PAYMENTS,\n    COUNT(CASE WHEN p.IS_FAILED     THEN 1 END)                AS FAILED_PAYMENTS,\n    ROUND(COUNT(CASE WHEN p.IS_SUCCESSFUL THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100, 2) AS SUCCESS_RATE_PCT,\n    ROUND(AVG(p.PROCESSING_TIME_MS), 0)                        AS AVG_PROCESSING_TIME_MS,\n    ROUND(PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY p.PROCESSING_TIME_MS), 0) AS P95_PROCESSING_TIME_MS\nFROM STG_PAYMENTS p\nLEFT JOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nLEFT JOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY p.PAYMENT_DAY, p.PAYMENT_TYPE, p.REGION, p.CHANNEL, c.SECTOR, c.RM_NAME, c.RM_TEAM;\n\nCREATE OR REPLACE TABLE MART_SLA_COMPLIANCE AS\nWITH daily_scheme AS (\n    SELECT PAYMENT_DAY, PAYMENT_TYPE,\n           SUM(TOTAL_PAYMENTS) AS TOTAL_PAYMENTS,\n           SUM(SUCCESSFUL_PAYMENTS) AS SUCCESSFUL_PAYMENTS,\n           SUM(FAILED_PAYMENTS) AS FAILED_PAYMENTS,\n           ROUND(SUM(SUCCESSFUL_PAYMENTS)::FLOAT / NULLIF(SUM(TOTAL_PAYMENTS), 0) * 100, 2) AS SUCCESS_RATE_PCT,\n           MAX(P95_PROCESSING_TIME_MS) AS P95_PROCESSING_TIME_MS\n    FROM MART_PAYMENT_KPIS\n    GROUP BY PAYMENT_DAY, PAYMENT_TYPE\n)\nSELECT\n    d.PAYMENT_DAY, d.PAYMENT_TYPE, s.SLA_NAME,\n    s.TARGET_SUCCESS_RATE    AS SLA_TARGET_PCT,\n    s.MAX_PROCESSING_TIME_MS AS SLA_THRESHOLD_MS,\n    d.SUCCESS_RATE_PCT       AS ACTUAL_SUCCESS_RATE,\n    d.P95_PROCESSING_TIME_MS AS ACTUAL_P95_MS,\n    d.TOTAL_PAYMENTS, d.FAILED_PAYMENTS,\n    CASE WHEN d.SUCCESS_RATE_PCT >= s.TARGET_SUCCESS_RATE\n           AND d.P95_PROCESSING_TIME_MS <= s.MAX_PROCESSING_TIME_MS THEN 'COMPLIANT'\n         WHEN d.SUCCESS_RATE_PCT >= s.TARGET_SUCCESS_RATE * 0.95 THEN 'AT RISK'\n         ELSE 'BREACH' END   AS SLA_STATUS,\n    ROUND(d.SUCCESS_RATE_PCT - s.TARGET_SUCCESS_RATE, 2) AS RATE_GAP_PCT,\n    d.P95_PROCESSING_TIME_MS - s.MAX_PROCESSING_TIME_MS  AS TIME_GAP_MS\nFROM daily_scheme d\nJOIN BARCLAYS_HOL.RAW_DATA.SLA_DEFINITIONS s ON d.PAYMENT_TYPE = s.PAYMENT_TYPE;\n\n-- CoCo-built marts from the original lab (DE1 step 3), pre-built here\nCREATE OR REPLACE TABLE MART_CUSTOMER_PAYMENTS AS\nWITH base AS (\n    SELECT c.CUSTOMER_ID, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           p.PAYMENT_TYPE, p.AMOUNT, p.IS_SUCCESSFUL, p.PROCESSING_TIME_MS\n    FROM STG_PAYMENTS p\n    JOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\n    JOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n), top_scheme AS (\n    SELECT CUSTOMER_ID, PAYMENT_TYPE AS MOST_USED_SCHEME\n    FROM base GROUP BY CUSTOMER_ID, PAYMENT_TYPE\n    QUALIFY ROW_NUMBER() OVER (PARTITION BY CUSTOMER_ID ORDER BY COUNT(*) DESC) = 1\n)\nSELECT b.CUSTOMER_ID, b.CUSTOMER_NAME, b.CUSTOMER_SECTOR, b.RM_NAME,\n       COUNT(*)                                                   AS TOTAL_PAYMENTS,\n       SUM(b.AMOUNT)                                              AS TOTAL_VOLUME_GBP,\n       ROUND(COUNT_IF(b.IS_SUCCESSFUL)::FLOAT / COUNT(*) * 100, 2) AS SUCCESS_RATE_PCT,\n       ROUND(AVG(b.PROCESSING_TIME_MS), 0)                        AS AVG_PROCESSING_TIME_MS,\n       t.MOST_USED_SCHEME\nFROM base b JOIN top_scheme t USING (CUSTOMER_ID)\nGROUP BY b.CUSTOMER_ID, b.CUSTOMER_NAME, b.CUSTOMER_SECTOR, b.RM_NAME, t.MOST_USED_SCHEME;\n\n-- ---------- AI enrichment (DA2 builds this step by step) ----------\nCREATE OR REPLACE TABLE FEEDBACK_ENRICHED AS\nWITH ai_scored AS (\n    SELECT f.*, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           ROUND(SNOWFLAKE.CORTEX.SENTIMENT(f.FEEDBACK_TEXT), 3) AS SENTIMENT_SCORE,\n           AI_CLASSIFY(f.FEEDBACK_TEXT,\n               ['Performance Issue','Service Quality','Technical Problem',\n                'Positive Experience','Feature Request']) AS CLASSIFICATION_RESULT\n    FROM STG_FEEDBACK f\n    LEFT JOIN STG_CUSTOMERS c ON f.CUSTOMER_ID = c.CUSTOMER_ID\n)\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR, RM_NAME,\n       PAYMENT_ID, FEEDBACK_CHANNEL, FEEDBACK_TEXT, PAYMENT_TYPE, RATING, SENTIMENT_SCORE,\n       CASE WHEN SENTIMENT_SCORE >  0.3 THEN 'POSITIVE'\n            WHEN SENTIMENT_SCORE < -0.3 THEN 'NEGATIVE'\n            ELSE 'NEUTRAL' END                      AS SENTIMENT_LABEL,\n       CLASSIFICATION_RESULT:labels[0]::STRING      AS TOPIC_CATEGORY\nFROM ai_scored;\n\nSELECT 'Core analytics catch-up complete' AS STATUS,\n       (SELECT COUNT(*) FROM MART_PAYMENT_KPIS)   AS KPI_ROWS,\n       (SELECT COUNT(*) FROM MART_SLA_COMPLIANCE) AS SLA_ROWS,\n       (SELECT COUNT(*) FROM FEEDBACK_ENRICHED)   AS FEEDBACK_ROWS;\n", "sql_name": "setup/catchup/core_analytics.sql"}, {"code": "semantic_view_and_agent", "title": "Catch-up: semantic view and agent", "body": "<p>Run this if a vignette lists it as a prerequisite and you have not built it yet.<\/p>", "sql": "-- =====================================================\n-- BARCLAYS PAYMENTS HOL v2 - CATCH-UP SCRIPT\n-- SEMANTIC VIEW SV_PAYMENTS + PAYMENTS_ASSISTANT AGENT\n-- Adapted from gemmamcginlay-sf/barclays-hol sql/05_intelligence.sql\n-- Requires: setup/catchup/core_analytics.sql (or DE1 + DA2)\n-- Used by: OPS1, OPS2, AI1, AI2 if you skipped DA1\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- =====================================================\n-- 5.1: Create Semantic View\n-- 3 logical tables, 1 relationship, 15 dimensions,\n-- 16 facts, 7 metrics, 8 verified queries\n-- =====================================================\n\nCREATE OR REPLACE SEMANTIC VIEW SV_PAYMENTS\n\n  -- Logical tables\n  TABLES (\n    payments AS BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n      PRIMARY KEY (PAYMENT_DAY, PAYMENT_TYPE, REGION, CHANNEL, CUSTOMER_SECTOR, RM_NAME, RM_TEAM)\n      WITH SYNONYMS = ('payment data', 'transactions')\n      COMMENT = 'Daily payment KPIs by scheme, region, channel, sector, and RM',\n\n    sla AS BARCLAYS_HOL.ANALYTICS.MART_SLA_COMPLIANCE\n      PRIMARY KEY (PAYMENT_DAY, PAYMENT_TYPE)\n      WITH SYNONYMS = ('sla data', 'compliance', 'service levels')\n      COMMENT = 'Daily SLA compliance per payment scheme',\n\n    feedback AS BARCLAYS_HOL.ANALYTICS.FEEDBACK_ENRICHED\n      PRIMARY KEY (FEEDBACK_ID)\n      WITH SYNONYMS = ('customer feedback', 'sentiment', 'complaints')\n      COMMENT = 'AI-enriched customer feedback with sentiment and topic classification'\n  )\n\n  -- Relationships\n  RELATIONSHIPS (\n    payments_sla AS payments (PAYMENT_DAY, PAYMENT_TYPE)\n      REFERENCES sla (PAYMENT_DAY, PAYMENT_TYPE)\n  )\n\n  -- Facts\n  FACTS (\n    -- Payment facts\n    payments.total_payments AS TOTAL_PAYMENTS\n      COMMENT = 'Number of payments',\n    payments.successful_payments AS SUCCESSFUL_PAYMENTS\n      COMMENT = 'Payments with COMPLETED status',\n    payments.failed_payments AS FAILED_PAYMENTS\n      COMMENT = 'Payments with FAILED status',\n    payments.total_volume_gbp AS TOTAL_VOLUME_GBP\n      WITH SYNONYMS = ('volume', 'payment volume')\n      COMMENT = 'Total amount in GBP',\n    payments.avg_payment_amount AS AVG_PAYMENT_AMOUNT\n      COMMENT = 'Average payment amount in GBP',\n    payments.avg_processing_time_ms AS AVG_PROCESSING_TIME_MS\n      WITH SYNONYMS = ('average latency')\n      COMMENT = 'Average processing time (ms)',\n    payments.p95_processing_time_ms AS P95_PROCESSING_TIME_MS\n      WITH SYNONYMS = ('p95 latency', 'p95')\n      COMMENT = '95th percentile processing time (ms)',\n\n    -- SLA facts\n    sla.sla_target_pct AS SLA_TARGET_PCT\n      COMMENT = 'SLA target success rate',\n    sla.sla_threshold_ms AS SLA_THRESHOLD_MS\n      COMMENT = 'SLA max P95 (ms)',\n    sla.actual_success_rate AS ACTUAL_SUCCESS_RATE\n      COMMENT = 'Actual daily success rate',\n    sla.actual_p95_ms AS ACTUAL_P95_MS\n      COMMENT = 'Actual daily P95 (ms)',\n    sla.rate_gap_pct AS RATE_GAP_PCT\n      COMMENT = 'Success rate gap vs target',\n    sla.time_gap_ms AS TIME_GAP_MS\n      COMMENT = 'P95 gap vs threshold (ms)',\n\n    -- Feedback facts\n    feedback.rating AS RATING\n      COMMENT = 'Satisfaction rating 1 to 5',\n    feedback.sentiment_score AS SENTIMENT_SCORE\n      WITH SYNONYMS = ('sentiment')\n      COMMENT = 'AI sentiment -1.0 to +1.0'\n  )\n\n  -- Dimensions\n  DIMENSIONS (\n    -- Payment dimensions\n    payments.payment_type AS PAYMENT_TYPE\n      WITH SYNONYMS = ('scheme', 'payment scheme', 'rail')\n      COMMENT = 'CHAPS, FASTER_PAYMENTS, BACS, SWIFT, SEPA, WIRE_TRANSFER',\n    payments.channel AS CHANNEL\n      COMMENT = 'API, Online Banking, Branch, File Upload, Mobile',\n    payments.region AS REGION\n      COMMENT = 'UK, EMEA, APAC, Americas',\n    payments.customer_sector AS CUSTOMER_SECTOR\n      WITH SYNONYMS = ('sector', 'industry')\n      COMMENT = 'Industry sector of originating customer',\n    payments.rm_name AS RM_NAME\n      WITH SYNONYMS = ('relationship manager', 'RM', 'account manager')\n      COMMENT = 'Relationship manager name',\n    payments.rm_team AS RM_TEAM\n      COMMENT = 'Corporate Banking, Institutional Banking, SME Banking',\n\n    -- SLA dimensions\n    sla.sla_name AS SLA_NAME\n      COMMENT = 'SLA definition name',\n    sla.sla_status AS SLA_STATUS\n      WITH SYNONYMS = ('compliance status')\n      COMMENT = 'COMPLIANT, AT RISK, or BREACH',\n\n    -- Feedback dimensions (enables sentiment/rating breakdown by scheme, sector, RM)\n    feedback.feedback_payment_type AS PAYMENT_TYPE\n      WITH SYNONYMS = ('feedback scheme', 'sentiment scheme')\n      COMMENT = 'Payment scheme on feedback rows: CHAPS, FASTER_PAYMENTS, BACS, SWIFT, SEPA',\n    feedback.customer_name AS CUSTOMER_NAME\n      WITH SYNONYMS = ('customer', 'client')\n      COMMENT = 'Feedback customer',\n    feedback.feedback_sector AS CUSTOMER_SECTOR\n      WITH SYNONYMS = ('feedback sector')\n      COMMENT = 'Sector of the customer who gave feedback',\n    feedback.feedback_rm AS RM_NAME\n      WITH SYNONYMS = ('feedback RM')\n      COMMENT = 'RM of the customer who gave feedback',\n    feedback.feedback_channel AS FEEDBACK_CHANNEL\n      COMMENT = 'Email, Phone, Portal, Survey, Chat',\n    feedback.sentiment_label AS SENTIMENT_LABEL\n      COMMENT = 'POSITIVE, NEUTRAL, or NEGATIVE',\n    feedback.topic_category AS TOPIC_CATEGORY\n      WITH SYNONYMS = ('topic', 'feedback topic')\n      COMMENT = 'AI-classified feedback topic'\n  )\n\n  -- Metrics (derived aggregations)\n  METRICS (\n    payments.success_rate AS\n      ROUND(SUM(payments.successful_payments)::FLOAT\n        / NULLIF(SUM(payments.total_payments), 0) * 100, 2)\n      WITH SYNONYMS = ('success rate', 'completion rate')\n      COMMENT = 'Weighted success rate',\n\n    payments.failure_rate AS\n      ROUND(SUM(payments.failed_payments)::FLOAT\n        / NULLIF(SUM(payments.total_payments), 0) * 100, 2)\n      WITH SYNONYMS = ('failure rate', 'error rate')\n      COMMENT = 'Weighted failure rate',\n\n    sla.breach_count AS\n      COUNT(CASE WHEN sla.sla_status = 'BREACH' THEN 1 END)\n      WITH SYNONYMS = ('breaches', 'sla breaches')\n      COMMENT = 'Number of BREACH records',\n\n    sla.at_risk_count AS\n      COUNT(CASE WHEN sla.sla_status = 'AT RISK' THEN 1 END)\n      COMMENT = 'Number of AT RISK records',\n\n    feedback.avg_sentiment AS\n      ROUND(AVG(feedback.sentiment_score), 3)\n      WITH SYNONYMS = ('average sentiment')\n      COMMENT = 'Average AI sentiment score',\n\n    feedback.negative_feedback_count AS\n      COUNT(CASE WHEN feedback.sentiment_label = 'NEGATIVE' THEN 1 END)\n      WITH SYNONYMS = ('complaints', 'negative reviews')\n      COMMENT = 'Count of negative feedback',\n\n    feedback.avg_rating AS\n      ROUND(AVG(feedback.rating), 1)\n      WITH SYNONYMS = ('average rating', 'customer rating')\n      COMMENT = 'Average satisfaction rating (1-5)'\n  )\n\n  COMMENT = 'Barclays Payments Operations \u2014 KPIs, SLA compliance, and customer sentiment'\n\n  -- AI instructions\n  AI_SQL_GENERATION\n    'UK payments operations. Schemes: CHAPS (same-day domestic), FASTER_PAYMENTS (real-time domestic max 250K),\n     BACS (T+2 domestic batch), SWIFT (T+2 international), SEPA (T+1 EUR), WIRE_TRANSFER (same-day domestic).\n     SUCCESS RATE: always SUM(SUCCESSFUL_PAYMENTS)/SUM(TOTAL_PAYMENTS)*100, never AVG(SUCCESS_RATE_PCT).\n     SLA: COMPLIANT=within thresholds, AT RISK=within 5pct of target, BREACH=below.\n     VOLUME: TOTAL_VOLUME_GBP for money, TOTAL_PAYMENTS for counts.\n     Processing times vary by scheme: FASTER_PAYMENTS ~500ms, SWIFT ~9000ms.\n     Sentiment: -1 to +1, POSITIVE>0.3, NEGATIVE<-0.3.\n     IMPORTANT: The feedback table has its own PAYMENT_TYPE, CUSTOMER_SECTOR, and RM_NAME dimensions.\n     For sentiment/rating/feedback questions broken down by payment type, sector, or RM, query the\n     feedback table directly using its own dimensions. Do NOT try to join to the payments table for these.'\n\n  AI_QUESTION_CATEGORIZATION\n    'Payment volumes/counts/rates/processing times/P95 -> payments table.\n     SLA compliance/breaches/targets/at risk -> sla table.\n     Satisfaction/sentiment/complaints/ratings/topics/feedback -> feedback table.\n     Sentiment or ratings BY payment type/scheme -> feedback table (has its own PAYMENT_TYPE).\n     Sentiment or ratings BY sector -> feedback table (has its own CUSTOMER_SECTOR).\n     Sentiment or ratings BY RM -> feedback table (has its own RM_NAME).'\n\n  -- Verified queries (teach the model how to answer common questions)\n  AI_VERIFIED_QUERIES (\n    monthly_volume AS (\n      QUESTION 'What is the total payment volume this month?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT SUM(TOTAL_VOLUME_GBP) AS total_volume_gbp\n           FROM BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n           WHERE PAYMENT_DAY >= DATE_TRUNC(''MONTH'', CURRENT_DATE())'\n    ),\n    success_by_scheme AS (\n      QUESTION 'What is the success rate by payment scheme?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT PAYMENT_TYPE,\n                  ROUND(SUM(SUCCESSFUL_PAYMENTS)::FLOAT / NULLIF(SUM(TOTAL_PAYMENTS), 0) * 100, 2) AS success_rate\n           FROM BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n           GROUP BY PAYMENT_TYPE ORDER BY success_rate'\n    ),\n    sla_breaches AS (\n      QUESTION 'Which schemes are breaching SLA?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT PAYMENT_TYPE, COUNT(*) AS breach_days\n           FROM BARCLAYS_HOL.ANALYTICS.MART_SLA_COMPLIANCE\n           WHERE SLA_STATUS = ''BREACH''\n             AND PAYMENT_DAY >= DATEADD(''day'', -30, CURRENT_DATE())\n           GROUP BY PAYMENT_TYPE ORDER BY breach_days DESC'\n    ),\n    top_rms AS (\n      QUESTION 'Top 5 relationship managers by volume?'\n      SQL 'SELECT RM_NAME, SUM(TOTAL_VOLUME_GBP) AS volume\n           FROM BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n           WHERE RM_NAME IS NOT NULL\n           GROUP BY RM_NAME ORDER BY volume DESC LIMIT 5'\n    ),\n    swift_p95 AS (\n      QUESTION 'Average P95 latency for SWIFT?'\n      SQL 'SELECT ROUND(AVG(P95_PROCESSING_TIME_MS)) AS avg_p95_ms\n           FROM BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n           WHERE PAYMENT_TYPE = ''SWIFT'''\n    ),\n    weekly_trend AS (\n      QUESTION 'Weekly payment volume trend'\n      SQL 'SELECT DATE_TRUNC(''WEEK'', PAYMENT_DAY) AS week,\n                  SUM(TOTAL_PAYMENTS) AS payments\n           FROM BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n           GROUP BY week ORDER BY week'\n    ),\n    failed_sectors AS (\n      QUESTION 'Which sectors have the most failures?'\n      SQL 'SELECT CUSTOMER_SECTOR, SUM(FAILED_PAYMENTS) AS failures\n           FROM BARCLAYS_HOL.ANALYTICS.MART_PAYMENT_KPIS\n           WHERE CUSTOMER_SECTOR IS NOT NULL\n           GROUP BY CUSTOMER_SECTOR ORDER BY failures DESC'\n    ),\n    sentiment_schemes AS (\n      QUESTION 'How does customer sentiment compare across payment types?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT PAYMENT_TYPE, ROUND(AVG(SENTIMENT_SCORE), 3) AS avg_sentiment,\n                  COUNT(*) AS feedback_count\n           FROM BARCLAYS_HOL.ANALYTICS.FEEDBACK_ENRICHED\n           GROUP BY PAYMENT_TYPE ORDER BY avg_sentiment'\n    )\n  );\n\n-- Verify\nSHOW SEMANTIC VIEWS IN SCHEMA BARCLAYS_HOL.ANALYTICS;\nSHOW SEMANTIC METRICS IN SV_PAYMENTS;\nSHOW SEMANTIC DIMENSIONS IN SV_PAYMENTS;\n\n-- =====================================================\n-- 5.2: Create Cortex Agent\n-- This agent is usable in CoWork, REST API, and SQL\n-- =====================================================\n\nCREATE OR REPLACE AGENT BARCLAYS_HOL.ANALYTICS.PAYMENTS_ASSISTANT\n  COMMENT = 'Payments operations assistant for Barclays HOL. Answers questions about payment volumes, SLA compliance, processing times, customer sectors, relationship managers, and customer sentiment.'\n  PROFILE = '{\"display_name\": \"Payments Assistant\", \"color\": \"blue\"}'\n  FROM SPECIFICATION\n  $$\n  orchestration:\n    tool_not_accessible: accept\n    budget:\n      seconds: 60\n      tokens: 16000\n\n  models:\n    orchestration: auto\n\n  instructions:\n    response: >\n      You are a payments operations assistant for a UK bank.\n      Answer questions clearly and concisely using data from the payments operations semantic view.\n      When presenting numbers, use appropriate formatting (commas for thousands, percentages with 1 decimal).\n      If asked about success rates, always use the weighted calculation: SUM(successful)/SUM(total)*100.\n      If the data does not contain enough information to answer, say so rather than guessing.\n      When showing tables, keep them to 10 rows or fewer unless the user asks for more.\n\n    orchestration: >\n      Use the Analyst tool for all questions about payment volumes, success rates, processing times,\n      SLA compliance, customer sectors, relationship managers, channels, regions, and customer sentiment.\n      The semantic view contains three logical tables:\n        - payments: daily KPIs by scheme, region, channel, sector, and RM\n        - sla: daily SLA compliance status per scheme (COMPLIANT, AT RISK, BREACH)\n        - feedback: AI-enriched customer feedback with sentiment scores, topic classification,\n          and its own PAYMENT_TYPE, CUSTOMER_SECTOR, and RM_NAME dimensions\n      For sentiment or feedback broken down by payment type, sector, or RM, the feedback table\n      has its own dimensions for these \u2014 no need to join to the payments table.\n\n    sample_questions:\n      - question: \"What is the total payment volume this month?\"\n      - question: \"Which payment scheme has the lowest success rate?\"\n      - question: \"How many SLA breaches occurred last week?\"\n      - question: \"Which relationship manager handles the most volume?\"\n      - question: \"How does customer sentiment compare across payment types?\"\n\n  tools:\n    - tool_spec:\n        type: \"cortex_analyst_text_to_sql\"\n        name: \"Analyst\"\n        description: >\n          Queries payment operations data including daily payment KPIs (volume, success rates,\n          processing times), SLA compliance (breach/at-risk/compliant status), and AI-enriched\n          customer feedback (sentiment scores, topic classification). Data covers 6 UK payment\n          schemes (CHAPS, Faster Payments, BACS, SWIFT, SEPA, Wire Transfer) with dimensions\n          for region, channel, customer sector, and relationship manager.\n    - tool_spec:\n        type: \"data_to_chart\"\n        name: \"data_to_chart\"\n        description: \"Generates charts and visualizations from query results\"\n\n  tool_resources:\n    Analyst:\n      semantic_view: \"BARCLAYS_HOL.ANALYTICS.SV_PAYMENTS\"\n      execution_environment:\n        type: \"warehouse\"\n        warehouse: \"BARCLAYS_WH\"\n  $$;\n\n-- Verify agent\nSHOW AGENTS IN SCHEMA BARCLAYS_HOL.ANALYTICS;\n", "sql_name": "setup/catchup/semantic_view_and_agent.sql"}], "pathways": {"Data Engineer": ["DE1", "DE2", "GOV2"], "Data Analyst": ["DA2", "DA1"], "Payments Ops": ["OPS1", "OPS2", "DA2"], "AI Builder": ["AI1", "AI3", "AI2"], "Governance": ["GOV1", "GOV2", "AI3"]}};
const byCode = Object.fromEntries(D.modules.map(m => [m.code, m]));
let persona = localStorage.getItem('hol_persona') || '';
const done = JSON.parse(localStorage.getItem('hol_done') || '{}');
function esc(s){return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function navItem(m){
  const b = document.createElement('button'); b.className = 'item'; b.dataset.code = m.code;
  b.innerHTML = '<span class="c">' + esc(m.code.length > 6 ? '' : m.code) + '</span>' + esc(m.title) + (done[m.code] ? '<span class="done">done</span>' : '');
  b.onclick = () => show(m.code); return b;
}
function render(){
  const P = document.getElementById('personas'); P.innerHTML = '';
  ['All', ...Object.keys(D.pathways)].forEach(p => {
    const b = document.createElement('button'); b.textContent = p;
    if ((p === 'All' && !persona) || p === persona) b.className = 'on';
    b.onclick = () => { persona = p === 'All' ? '' : p; localStorage.setItem('hol_persona', persona); render(); };
    P.appendChild(b);
  });
  const sets = {core: [], vign: [], catch: []};
  D.modules.forEach(m => (m.code === 'C1' || m.code === 'C2' ? sets.core : m.sql_name.includes('catchup') ? sets.catch : sets.vign).push(m));
  const order = persona ? D.pathways[persona] : null;
  if (order) sets.vign.sort((a, b) => (order.indexOf(a.code) + 1 || 99) - (order.indexOf(b.code) + 1 || 99));
  for (const [id, list] of Object.entries(sets)) {
    const el = document.getElementById(id); el.innerHTML = '';
    list.forEach(m => { const n = navItem(m); if (order && id === 'vign' && !order.includes(m.code)) n.classList.add('dim'); el.appendChild(n); });
  }
}
function show(code){
  const m = byCode[code];
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('on', i.dataset.code === code));
  let h = '<h2>' + esc(m.code) + ': ' + esc(m.title) + '</h2>' + m.body;
  if (m.sql) h += '<div class="sqlbar"><span class="muted">' + esc(m.sql_name) + '</span><span>'
      + '<button class="btn ghost" id="cp">Copy SQL</button> <button class="btn" id="dn">' + (done[code] ? 'Completed' : 'Mark complete') + '</button></span></div>'
      + '<pre>' + esc(m.sql) + '</pre>';
  const main = document.getElementById('main'); main.innerHTML = h; main.scrollTop = 0;
  const cp = document.getElementById('cp');
  if (cp) cp.onclick = () => navigator.clipboard.writeText(m.sql).then(() => cp.textContent = 'Copied');
  const dn = document.getElementById('dn');
  if (dn) dn.onclick = () => { done[code] = !done[code]; localStorage.setItem('hol_done', JSON.stringify(done)); render(); show(code); };
}
render();
show('C1');
</script></body></html>
