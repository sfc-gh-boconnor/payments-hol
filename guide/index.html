<header><h1>Barclays Payments Operations - Hands-on Lab v2</h1>
<p>Corporate banking payments data product on Snowflake - Iceberg to governed AI agents. Synthetic data only.</p></header>

<script>
const D = {"modules": [{"code": "C1", "title": "Explore the Iceberg data product", "body": "<p>Shared core for every pathway. Read the published Iceberg tables, prove the read-only guard-rails and build a first client 360 query.<\/p>", "sql": "-- =====================================================\n-- BARCLAYS PAYMENTS HOL v2 - SHARED CORE\n-- C1: EXPLORE THE PUBLISHED ICEBERG DATA PRODUCT  (~25 min, all personas)\n--\n-- Business context: you are part of Payments Operations for Corporate\n-- Banking. The platform team has published nine source tables to the\n-- enterprise data platform as Iceberg tables. You can read them but you\n-- cannot load or change them - exactly like Barclayflake.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.RAW_DATA;\n\n-- C1.1 What has been published to us?\nSHOW ICEBERG TABLES IN SCHEMA BARCLAYS_HOL.RAW_DATA;\n-- Note the catalog (SNOWFLAKE) and that storage is Snowflake-managed.\n-- At Barclays the same tables sit on the bank's own object storage\n-- via an external volume; the SQL you write is identical.\n\n-- C1.2 Iceberg tables keep open metadata - this is what lets other engines\n-- (Spark, Trino, etc.) read the same data with no copy.\nSELECT SYSTEM$GET_ICEBERG_TABLE_INFORMATION('BARCLAYS_HOL.RAW_DATA.PAYMENTS') AS ICEBERG_METADATA;\n\n-- C1.3 Prove the guard-rails: attendees cannot load or modify source data.\n-- Expect: \"Insufficient privileges\". This is intentional.\n-- INSERT INTO PAYMENTS (PAYMENT_ID) VALUES ('TEST');\n\n-- C1.4 Get to know the data model (see docs/data_sources.md for the ERD)\nSELECT 'PAYMENTS' AS TABLE_NAME, COUNT(*) AS ROW_COUNT FROM PAYMENTS\nUNION ALL SELECT 'CUSTOMER_FEEDBACK',     COUNT(*) FROM CUSTOMER_FEEDBACK\nUNION ALL SELECT 'OPERATIONAL_ALERTS',    COUNT(*) FROM OPERATIONAL_ALERTS\nUNION ALL SELECT 'CUSTOMERS',             COUNT(*) FROM CUSTOMERS\nUNION ALL SELECT 'ACCOUNTS',              COUNT(*) FROM ACCOUNTS\nUNION ALL SELECT 'RELATIONSHIP_MANAGERS', COUNT(*) FROM RELATIONSHIP_MANAGERS\nORDER BY ROW_COUNT DESC;\n\n-- C1.5 Payments mix by scheme - the six UK/international rails\nSELECT PAYMENT_TYPE,\n       COUNT(*)                                        AS PAYMENTS,\n       ROUND(SUM(AMOUNT) / 1e6, 1)                     AS VOLUME_M,\n       ROUND(COUNT_IF(STATUS = 'COMPLETED') / COUNT(*) * 100, 2) AS SUCCESS_RATE_PCT\nFROM PAYMENTS\nGROUP BY PAYMENT_TYPE\nORDER BY PAYMENTS DESC;\n\n-- C1.6 A corporate client 360 in one query: customer -> RM -> accounts -> payments -> feedback\nSELECT c.CUSTOMER_NAME, c.SECTOR, r.RM_NAME, r.TEAM,\n       COUNT(DISTINCT a.ACCOUNT_ID)                    AS ACCOUNTS,\n       COUNT(DISTINCT p.PAYMENT_ID)                    AS PAYMENTS,\n       COUNT(DISTINCT IFF(p.STATUS = 'FAILED', p.PAYMENT_ID, NULL)) AS FAILED,\n       COUNT(DISTINCT f.FEEDBACK_ID)                   AS FEEDBACK_ITEMS\nFROM CUSTOMERS c\nJOIN RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID\nJOIN ACCOUNTS a              ON a.CUSTOMER_ID = c.CUSTOMER_ID\nLEFT JOIN PAYMENTS p         ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nLEFT JOIN CUSTOMER_FEEDBACK f ON f.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY ALL\nORDER BY FAILED DESC\nLIMIT 10;\n\n-- C1.7 Iceberg time travel works too: what did PAYMENTS look like an hour ago?\n-- (Uncomment once the tables are at least a few minutes old.)\n-- SELECT COUNT(*) FROM PAYMENTS AT (OFFSET => -60*5);\n\n-- C1.8 Ask Cortex Code (CoCo panel in your Workspace):\n--   \"Describe the tables in BARCLAYS_HOL.RAW_DATA and how they join together.\"\n--   \"Which customers have the highest payment failure rate? Write the SQL and run it.\"\n\nSELECT 'Core C1 complete - pick your pathway in pathways/' AS STATUS;\n", "sql_name": "core/C1_explore_iceberg.sql"}, {"code": "C2", "title": "Data product tour", "body": "<h2>C2: Data product tour (20 min, all personas, facilitator-led)<\/h2>\n<p>A guided look at the end state everyone will be building towards, so each pathway knows where its work fits.<\/p>\n<p>```<\/p>\n<p>            Barclays enterprise data platform (published, read-only)<\/p>\n<p> \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510<\/p>\n<p> \u2502 RAW_DATA - 9 Snowflake-managed Iceberg tables                       \u2502<\/p>\n<p> \u2502 PAYMENTS  CUSTOMERS  ACCOUNTS  RELATIONSHIP_MANAGERS  CUSTOMER_FEEDBACK \u2502<\/p>\n<p> \u2502 OPERATIONAL_ALERTS  PAYMENT_SCHEMES  SLA_DEFINITIONS  ERROR_CODES    \u2502<\/p>\n<p> \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518<\/p>\n<p>                 \u2502  Data Engineer: DE1 dbt, DE2 dynamic tables + DMFs<\/p>\n<p> \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510<\/p>\n<p> \u2502 ANALYTICS - staging views, marts, dynamic tables, DP_* Iceberg      \u2502<\/p>\n<p> \u2502            data products, FEEDBACK_ENRICHED (Analyst: DA2 AI SQL)   \u2502<\/p>\n<p> \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518<\/p>\n<p>                 \u2502  Analyst: DA1 semantic views SV_CLIENT_360, SV_PAYMENTS<\/p>\n<p> \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25bc\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510<\/p>\n<p> \u2502 AI - Corporate Payments 360 agent (OPS1), triage (OPS2),            \u2502<\/p>\n<p> \u2502      custom tools (AI1), MCP server (AI2),                          \u2502<\/p>\n<p> \u2502      Marketplace knowledge extension instead of Cortex Search (AI3) \u2502<\/p>\n<p> \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518<\/p>\n<p>   Governance across every layer: classification, tags, masking,<\/p>\n<p>   row access (GOV1); lineage, access history, agent monitoring (GOV2)<\/p>\n<p>```<\/p>\n<h3>Talking points<\/h3>\n<ol>\n<li><strong>Iceberg is the contract.<\/strong> Source data arrives centrally as Iceberg, so the same files can be read by other engines. Attendees cannot load or change it, and that is deliberate.<\/li>\n<li><strong>Build data products, not copies.<\/strong> Everything downstream is a view, dynamic table or mart. DE1 publishes a mart back out as Iceberg.<\/li>\n<li><strong>A semantic view is the trust layer for AI.<\/strong> Business definitions (success rate, value at risk, open alerts) live in one place. Analyst, agents and MCP clients all use it.<\/li>\n<li><strong>What&#x27;s approved at Barclays.<\/strong> Semantic views, Cortex Agents, Snowflake Intelligence/CoWork and MCP are moving forward this quarter. Cortex Search over internal data is not yet approved, so AI3 shows the knowledge-extension alternative.<\/li>\n<li><strong>Governance follows the data.<\/strong> Policies on the source flow through every model, view and agent, because agents run as the user.<\/li>\n<\/ol>\n<h3>Demo (facilitator, 5 min)<\/h3>\n<p>If the facilitator has run the full build, open Snowflake Intelligence and ask <strong>Corporate Payments 360<\/strong>: &quot;Brief me on the client with the most failed payment value.&quot; Then show the lineage graph for <code>RAW_DATA.PAYMENTS<\/code> in Catalog.<\/p>", "sql": "", "sql_name": ""}, {"code": "DE1", "title": "Iceberg + dbt pipeline with Cortex Code", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Engineer<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~60 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Core C1 only<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>de1.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Turn the published Iceberg sources into governed, tested data products - and publish them back to the lake as Iceberg.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>dbt Project on Snowflake <code>BARCLAYS_DBT<\/code> (4 staging views, 2 marts, 27 tests)<\/li>\n<li>Two CoCo-built marts: <code>mart_customer_payments<\/code>, <code>mart_rm_performance<\/code><\/li>\n<li>Nightly task <code>TSK_DBT_NIGHTLY_BUILD<\/code> (suspended)<\/li>\n<li>Iceberg data product <code>DP_SLA_COMPLIANCE<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Open a Workspace from this Git repo and walk <code>dbt/<\/code> - sources point at <code>RAW_DATA<\/code> Iceberg tables with no code changes.<\/li>\n<li>Deploy <code>dbt/<\/code> as a dbt Project and run <code>build<\/code> (Workspace <strong>Deploy/Run<\/strong>, or <code>EXECUTE DBT PROJECT<\/code>).<\/li>\n<li>Use the two Cortex Code prompts to generate the missing marts; re-run <code>build<\/code> until the pre-written tests pass.<\/li>\n<li>Schedule the project with a task.<\/li>\n<li>Publish <code>MART_SLA_COMPLIANCE<\/code> back out as an Iceberg table.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Create a dbt mart model mart_customer_payments ... (full prompt in de1.sql)&quot;<\/em><\/li>\n<li><em>&quot;Create mart_rm_performance ... then run dbt build and fix any failing tests.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p><code>EXECUTE DBT PROJECT<\/code> reports <code>PASS=27 ERROR=0<\/code> (more once the CoCo marts exist); <code>SHOW ICEBERG TABLES IN SCHEMA ANALYTICS<\/code> lists <code>DP_SLA_COMPLIANCE<\/code>.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Production Iceberg tables use the bank&#x27;s external volume (one volume, one IAM role across accounts) rather than Snowflake-managed storage. dbt models and SQL are otherwise identical.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DE1: ICEBERG + dbt PIPELINE WITH CORTEX CODE   (~60 min)\n-- Persona: Data Engineer\n-- Question: \"Turn the published Iceberg sources into governed, tested\n--            data products - and publish them back to the lake as Iceberg.\"\n-- Prereq:   Core C1 only. (Produces everything core_analytics.sql would.)\n--\n-- Work in a Snowflake Workspace connected to this Git repo:\n--   Projects > Workspaces > From Git repository\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DE1.1 Walk the dbt project (Workspace file explorer: dbt/)\n--   models/staging/schema.yml  - sources point at BARCLAYS_HOL.RAW_DATA (Iceberg)\n--   models/staging/*.sql       - 4 views: cast, clean, denormalise\n--   models/marts/*.sql         - mart_payment_kpis, mart_sla_compliance\n--   macros/generate_schema_name.sql - land models in ANALYTICS, not ANALYTICS_ANALYTICS\n-- dbt reads Iceberg sources exactly like native tables. No code changes.\n-- -----------------------------------------------------\n\n-- -----------------------------------------------------\n-- DE1.2 Deploy and run as a dbt Project on Snowflake\n-- In the Workspace: select dbt/ > Deploy > name BARCLAYS_DBT, then Run > build.\n-- Or from SQL / a task (this is how you would schedule it in production):\n-- (Facilitator: the project object is created by `snow dbt deploy` or the Workspace.)\n-- -----------------------------------------------------\nEXECUTE DBT PROJECT BARCLAYS_HOL.ANALYTICS.BARCLAYS_DBT ARGS = 'build';\n-- Expect: Done. PASS=27 WARN=0 ERROR=0\n\n-- Schedule it - one task, no external orchestrator\nCREATE OR REPLACE TASK TSK_DBT_NIGHTLY_BUILD\n    WAREHOUSE = BARCLAYS_WH\n    SCHEDULE  = 'USING CRON 0 5 * * * Europe/London'\nAS\n    EXECUTE DBT PROJECT BARCLAYS_HOL.ANALYTICS.BARCLAYS_DBT ARGS = 'build';\n-- Left suspended for the lab. In production: ALTER TASK TSK_DBT_NIGHTLY_BUILD RESUME;\n\n-- -----------------------------------------------------\n-- DE1.3 Accelerate with Cortex Code (CoCo panel in the Workspace)\n-- Prompt 1:\n--   \"Create a dbt mart model mart_customer_payments in dbt/models/marts that\n--    summarises payment activity per customer: total payments, total volume,\n--    success rate and most-used payment scheme. Join stg_payments -> stg_accounts\n--    -> stg_customers and follow the patterns in mart_payment_kpis.sql.\"\n-- Prompt 2:\n--   \"Create mart_rm_performance: one row per relationship manager with rm_id,\n--    rm_name, client_count, total volume, average success rate and their client\n--    with the lowest success rate. Then run dbt build and fix any failing tests.\"\n-- The tests for both models already exist in models/marts/schema.yml, so\n-- `dbt build` proves CoCo's code is correct.\n-- -----------------------------------------------------\n\n-- -----------------------------------------------------\n-- DE1.4 Validate\n-- -----------------------------------------------------\nSELECT 'STG_PAYMENTS' AS OBJ, COUNT(*) AS ROWS_ FROM STG_PAYMENTS\nUNION ALL SELECT 'MART_PAYMENT_KPIS',   COUNT(*) FROM MART_PAYMENT_KPIS\nUNION ALL SELECT 'MART_SLA_COMPLIANCE', COUNT(*) FROM MART_SLA_COMPLIANCE;\n\nSELECT SLA_STATUS, COUNT(*) AS SCHEME_DAYS\nFROM MART_SLA_COMPLIANCE GROUP BY SLA_STATUS ORDER BY SCHEME_DAYS DESC;\n\n-- -----------------------------------------------------\n-- DE1.5 Publish the data product back to the lake as Iceberg\n-- Consumers on other engines (Spark, Trino, etc.) can now read the mart with no copy.\n-- Iceberg stores microsecond precision, so timestamps are cast to scale 6.\n-- -----------------------------------------------------\nCREATE OR REPLACE ICEBERG TABLE DP_SLA_COMPLIANCE\n    CATALOG = 'SNOWFLAKE'\n    COMMENT = 'Data product: daily SLA compliance per payment scheme (Iceberg)'\nAS SELECT * REPLACE (PAYMENT_DAY::TIMESTAMP_NTZ(6) AS PAYMENT_DAY)\n   FROM MART_SLA_COMPLIANCE;\n\nSELECT SYSTEM$GET_ICEBERG_TABLE_INFORMATION('BARCLAYS_HOL.ANALYTICS.DP_SLA_COMPLIANCE') AS METADATA_LOCATION;\n\n-- Barclayflake note: in production the Iceberg table would use the bank's\n-- EXTERNAL_VOLUME (one volume and one IAM role, shared across accounts)\n-- instead of Snowflake-managed storage. The SQL above is otherwise unchanged.\n\nSELECT 'DE1 complete' AS STATUS;\n", "sql_name": "vignettes/de1_iceberg_dbt_pipeline/de1.sql"}, {"code": "DE2", "title": "Dynamic Tables + data quality", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Engineer<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code> (or DE1 + DA2)<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>de2.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Keep an ops-floor SLA monitor fresh without orchestration code, and prove the data feeding it is trustworthy.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>DT_LIVE_SLA_BREACHES<\/code> (1-minute lag)<\/li>\n<li><code>DT_FAILED_PAYMENT_TRIAGE<\/code> reading Iceberg directly, chained to <code>DT_RETRYABLE_SUMMARY<\/code><\/li>\n<li>System and custom data metric functions with an expectation on <code>MART_CUSTOMER_PAYMENTS<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Create the three dynamic tables and inspect the pipeline graph in <strong>Monitoring &gt; Dynamic Tables<\/strong>.<\/li>\n<li>Attach <code>NULL_COUNT<\/code> and <code>DUPLICATE_COUNT<\/code> DMFs and a custom <code>INVALID_SUCCESS_RATE_COUNT<\/code> DMF.<\/li>\n<li>Add an expectation and run the checks on demand.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Add a dynamic table DT_HIGH_VALUE_FAILURES ... refreshing every 2 minutes.&quot;<\/em><\/li>\n<li><em>&quot;Add a data metric function to MART_PAYMENT_KPIS that counts rows where P95 &lt; average, and attach it.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p><code>SELECT * FROM DT_RETRYABLE_SUMMARY<\/code> returns rows; the on-demand DMF query returns <code>0, 0, 0<\/code>.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Real-time payments streaming is out of scope at Barclays today; dynamic tables give near-real-time freshness over data the platform already lands.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DE2: DYNAMIC TABLES + DATA QUALITY   (~45 min)\n-- Persona: Data Engineer\n-- Question: \"How do I keep an ops-floor SLA monitor fresh without writing\n--            orchestration, and prove the data feeding it is trustworthy?\"\n-- Prereq:   setup/catchup/core_analytics.sql  (or DE1 + DA2)\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DE2.1 Dynamic Tables: declare the result, Snowflake keeps it fresh\n-- -----------------------------------------------------\n\n-- Ops-floor SLA breach monitor: never more than 1 minute stale\nCREATE OR REPLACE DYNAMIC TABLE DT_LIVE_SLA_BREACHES\n    TARGET_LAG = '1 minute'\n    WAREHOUSE  = BARCLAYS_WH\nAS\nSELECT PAYMENT_TYPE,\n       SUM(TOTAL_PAYMENTS)  AS TOTAL_PAYMENTS,\n       SUM(FAILED_PAYMENTS) AS BREACHED_PAYMENTS,\n       ROUND(SUM(FAILED_PAYMENTS)::FLOAT / NULLIF(SUM(TOTAL_PAYMENTS), 0) * 100, 2) AS BREACH_RATE_PCT,\n       MIN(PAYMENT_DAY) AS EARLIEST_BREACH,\n       MAX(PAYMENT_DAY) AS LATEST_BREACH\nFROM MART_SLA_COMPLIANCE\nWHERE SLA_STATUS = 'BREACH'\nGROUP BY PAYMENT_TYPE;\n\n-- Failed-payment triage feed built straight off the Iceberg source.\n-- Dynamic tables can read Iceberg tables directly - no copy into Snowflake storage.\nCREATE OR REPLACE DYNAMIC TABLE DT_FAILED_PAYMENT_TRIAGE\n    TARGET_LAG = DOWNSTREAM\n    WAREHOUSE  = BARCLAYS_WH\nAS\nSELECT p.PAYMENT_ID, p.PAYMENT_DATE, p.PAYMENT_TYPE, p.AMOUNT, p.CURRENCY,\n       p.ERROR_CODE, e.ERROR_DESCRIPTION, e.ERROR_CATEGORY, e.IS_RETRYABLE,\n       c.CUSTOMER_NAME, c.SECTOR, r.RM_NAME\nFROM BARCLAYS_HOL.RAW_DATA.PAYMENTS p\nJOIN BARCLAYS_HOL.RAW_DATA.ERROR_CODES e  ON p.ERROR_CODE = e.ERROR_CODE\nJOIN BARCLAYS_HOL.RAW_DATA.ACCOUNTS a     ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nJOIN BARCLAYS_HOL.RAW_DATA.CUSTOMERS c    ON a.CUSTOMER_ID = c.CUSTOMER_ID\nJOIN BARCLAYS_HOL.RAW_DATA.RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID\nWHERE p.STATUS IN ('FAILED', 'RETURNED');\n\n-- Downstream summary chained off the triage feed\nCREATE OR REPLACE DYNAMIC TABLE DT_RETRYABLE_SUMMARY\n    TARGET_LAG = '5 minutes'\n    WAREHOUSE  = BARCLAYS_WH\nAS\nSELECT PAYMENT_TYPE, ERROR_CATEGORY, IS_RETRYABLE,\n       COUNT(*) AS PAYMENTS, ROUND(SUM(AMOUNT), 2) AS VALUE_AT_RISK\nFROM DT_FAILED_PAYMENT_TRIAGE\nGROUP BY ALL;\n\nSHOW DYNAMIC TABLES IN SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- Refresh history and the pipeline graph are also visible in Snowsight:\n-- Monitoring > Dynamic Tables > DT_RETRYABLE_SUMMARY > Graph\nSELECT NAME, STATE, REFRESH_ACTION, REFRESH_TRIGGER, DATA_TIMESTAMP\nFROM TABLE(INFORMATION_SCHEMA.DYNAMIC_TABLE_REFRESH_HISTORY())\nWHERE NAME LIKE 'DT_%'\nORDER BY DATA_TIMESTAMP DESC\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- DE2.2 Data Metric Functions: quality checks that run on a schedule\n-- -----------------------------------------------------\n\n-- Schedule is set per table; changes also trigger a check\nALTER TABLE MART_CUSTOMER_PAYMENTS SET DATA_METRIC_SCHEDULE = 'TRIGGER_ON_CHANGES';\n\n-- System DMFs\nALTER TABLE MART_CUSTOMER_PAYMENTS ADD DATA METRIC FUNCTION\n    SNOWFLAKE.CORE.NULL_COUNT ON (RM_NAME);\nALTER TABLE MART_CUSTOMER_PAYMENTS ADD DATA METRIC FUNCTION\n    SNOWFLAKE.CORE.DUPLICATE_COUNT ON (CUSTOMER_ID);\n\n-- A custom, business-rule DMF: success rate must be a valid percentage\n-- (the argument type must match the column type - SUCCESS_RATE_PCT is FLOAT)\nCREATE OR REPLACE DATA METRIC FUNCTION INVALID_SUCCESS_RATE_COUNT(\n    t TABLE (SUCCESS_RATE_PCT FLOAT))\nRETURNS NUMBER\nAS\n$$\n    SELECT COUNT(*) FROM t\n    WHERE SUCCESS_RATE_PCT IS NULL OR SUCCESS_RATE_PCT < 0 OR SUCCESS_RATE_PCT > 100\n$$;\n\nALTER TABLE MART_CUSTOMER_PAYMENTS ADD DATA METRIC FUNCTION\n    INVALID_SUCCESS_RATE_COUNT ON (SUCCESS_RATE_PCT);\n\n-- Expectations: turn a metric into a pass/fail rule\nALTER TABLE MART_CUSTOMER_PAYMENTS MODIFY DATA METRIC FUNCTION\n    SNOWFLAKE.CORE.DUPLICATE_COUNT ON (CUSTOMER_ID)\n    ADD EXPECTATION NO_DUPLICATE_CUSTOMERS (VALUE = 0);\n\n-- Which checks are attached?\nSELECT METRIC_NAME, REF_ARGUMENTS, SCHEDULE, SCHEDULE_STATUS\nFROM TABLE(INFORMATION_SCHEMA.DATA_METRIC_FUNCTION_REFERENCES(\n    REF_ENTITY_NAME   => 'BARCLAYS_HOL.ANALYTICS.MART_CUSTOMER_PAYMENTS',\n    REF_ENTITY_DOMAIN => 'TABLE'));\n\n-- Run the checks on demand (scheduled results land in\n-- SNOWFLAKE.LOCAL.DATA_QUALITY_MONITORING_RESULTS after a few minutes)\nSELECT SNOWFLAKE.CORE.NULL_COUNT(SELECT RM_NAME FROM MART_CUSTOMER_PAYMENTS)        AS NULL_RM_NAMES,\n       SNOWFLAKE.CORE.DUPLICATE_COUNT(SELECT CUSTOMER_ID FROM MART_CUSTOMER_PAYMENTS) AS DUPLICATE_CUSTOMERS,\n       INVALID_SUCCESS_RATE_COUNT(SELECT SUCCESS_RATE_PCT FROM MART_CUSTOMER_PAYMENTS) AS INVALID_RATES;\n\n-- -----------------------------------------------------\n-- DE2.3 Cortex Code prompts (try in the CoCo panel)\n-- -----------------------------------------------------\n--  \"Add a dynamic table DT_HIGH_VALUE_FAILURES in BARCLAYS_HOL.ANALYTICS showing\n--   failed CHAPS payments over 1m GBP with the customer and RM, refreshing every\n--   2 minutes. Then show me its refresh history.\"\n--  \"Add a data metric function to MART_PAYMENT_KPIS that counts rows where\n--   P95_PROCESSING_TIME_MS is less than AVG_PROCESSING_TIME_MS, and attach it.\"\n\nSELECT 'DE2 complete' AS STATUS;\n", "sql_name": "vignettes/de2_dynamic_tables_quality/de2.sql"}, {"code": "DA1", "title": "Build a semantic view + ask Cortex Analyst", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~60 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>da1.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Give RMs and ops a single, trusted definition of a corporate client&#x27;s payments health that anyone can query in plain English.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Contract views <code>V_CLIENT_PAYMENT_SUMMARY<\/code>, <code>V_CLIENT_ALERTS<\/code><\/li>\n<li>Semantic view <code>SV_CLIENT_360<\/code> (4 tables, 3 relationships, 9 metrics, 2 verified queries)<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Compare with the worked example <code>SV_PAYMENTS<\/code> in <code>setup/catchup/semantic_view_and_agent.sql<\/code>.<\/li>\n<li>Create the contract views, then the semantic view (DDL, Snowsight UI, or CoCo).<\/li>\n<li>Query it with <code>SEMANTIC_VIEW(...)<\/code> SQL.<\/li>\n<li>Ask questions in Cortex Analyst and read the generated SQL.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Create a semantic view over STG_CUSTOMERS, V_CLIENT_PAYMENT_SUMMARY, FEEDBACK_ENRICHED and V_CLIENT_ALERTS joined on CUSTOMER_ID.&quot;<\/em><\/li>\n<li><em>&quot;Add a verified query to SV_CLIENT_360 for &#x27;clients with negative sentiment and success rate below 96%&#x27;.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>The <code>SEMANTIC_VIEW<\/code> query returns one row per RM with volume, success rate and open alerts.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Semantic views, Analyst and agents are approved for rollout at Barclays this quarter.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DA1: BUILD A SEMANTIC VIEW + ASK CORTEX ANALYST   (~60 min)\n-- Persona: Data Analyst\n-- Question: \"Give RMs and ops a single, trusted definition of a corporate\n--            client's payments health that anyone can query in plain English.\"\n-- Prereq:   setup/catchup/core_analytics.sql  (STG_* views, FEEDBACK_ENRICHED)\n-- Builds:   V_CLIENT_PAYMENT_SUMMARY, V_CLIENT_ALERTS, SV_CLIENT_360\n-- (SV_PAYMENTS from the original lab is in setup/catchup/semantic_view_and_agent.sql\n--  - open it and compare as a worked example.)\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DA1.1 Stable interface views (semantic views should sit on contracts, not raw)\n-- -----------------------------------------------------\nCREATE OR REPLACE VIEW V_CLIENT_PAYMENT_SUMMARY\n    COMMENT = 'One row per corporate client: payment volumes, success and latency'\nAS\nSELECT c.CUSTOMER_ID,\n       COUNT(*)                                                     AS TOTAL_PAYMENTS,\n       COUNT_IF(p.IS_SUCCESSFUL)                                    AS SUCCESSFUL_PAYMENTS,\n       COUNT_IF(p.IS_FAILED)                                        AS FAILED_PAYMENTS,\n       SUM(p.AMOUNT)                                                AS TOTAL_VOLUME_GBP,\n       SUM(IFF(p.IS_FAILED, p.AMOUNT, 0))                           AS FAILED_VOLUME_GBP,\n       ROUND(AVG(p.PROCESSING_TIME_MS), 0)                          AS AVG_PROCESSING_TIME_MS,\n       MAX(p.PAYMENT_DATE)                                          AS LAST_PAYMENT_DATE\nFROM STG_PAYMENTS p\nJOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nJOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY c.CUSTOMER_ID;\n\nCREATE OR REPLACE VIEW V_CLIENT_ALERTS\n    COMMENT = 'Operational alerts attributed to the originating corporate client'\nAS\nSELECT al.ALERT_ID, a.CUSTOMER_ID, al.ALERT_TIME::TIMESTAMP AS ALERT_TIME,\n       al.SEVERITY, al.PAYMENT_TYPE, al.STATUS AS ALERT_STATUS,\n       al.ASSIGNED_TO, al.RESOLUTION_TIME_MIN, al.ALERT_DESCRIPTION\nFROM BARCLAYS_HOL.RAW_DATA.OPERATIONAL_ALERTS al\nJOIN BARCLAYS_HOL.RAW_DATA.PAYMENTS p ON al.PAYMENT_ID = p.PAYMENT_ID\nJOIN BARCLAYS_HOL.RAW_DATA.ACCOUNTS a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID;\n\n-- -----------------------------------------------------\n-- DA1.2 The semantic view: business names, relationships, metrics, synonyms\n-- Tip: you can also build this in Snowsight (AI & ML > Cortex Analyst > Create)\n-- or ask CoCo: \"Create a semantic view over STG_CUSTOMERS, V_CLIENT_PAYMENT_SUMMARY,\n-- FEEDBACK_ENRICHED and V_CLIENT_ALERTS joined on CUSTOMER_ID.\"\n-- -----------------------------------------------------\nCREATE OR REPLACE SEMANTIC VIEW SV_CLIENT_360\n\n  TABLES (\n    clients AS BARCLAYS_HOL.ANALYTICS.STG_CUSTOMERS\n      PRIMARY KEY (CUSTOMER_ID)\n      WITH SYNONYMS = ('customers', 'corporate clients', 'accounts')\n      COMMENT = 'Corporate banking clients with KYC status and assigned relationship manager',\n    payments AS BARCLAYS_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY\n      PRIMARY KEY (CUSTOMER_ID)\n      COMMENT = 'Payment activity summary per client',\n    feedback AS BARCLAYS_HOL.ANALYTICS.FEEDBACK_ENRICHED\n      PRIMARY KEY (FEEDBACK_ID)\n      WITH SYNONYMS = ('complaints', 'customer feedback', 'sentiment')\n      COMMENT = 'Client feedback with AI sentiment and topic',\n    alerts AS BARCLAYS_HOL.ANALYTICS.V_CLIENT_ALERTS\n      PRIMARY KEY (ALERT_ID)\n      WITH SYNONYMS = ('incidents', 'operational alerts')\n      COMMENT = 'Operational payment alerts per client'\n  )\n\n  RELATIONSHIPS (\n    payments_to_clients AS payments (CUSTOMER_ID) REFERENCES clients,\n    feedback_to_clients AS feedback (CUSTOMER_ID) REFERENCES clients,\n    alerts_to_clients   AS alerts   (CUSTOMER_ID) REFERENCES clients\n  )\n\n  FACTS (\n    payments.total_payments      AS TOTAL_PAYMENTS,\n    payments.successful_payments AS SUCCESSFUL_PAYMENTS,\n    payments.failed_payments     AS FAILED_PAYMENTS,\n    payments.total_volume_gbp    AS TOTAL_VOLUME_GBP,\n    payments.failed_volume_gbp   AS FAILED_VOLUME_GBP,\n    feedback.sentiment_score     AS SENTIMENT_SCORE,\n    feedback.rating              AS RATING,\n    alerts.resolution_time_min   AS RESOLUTION_TIME_MIN\n  )\n\n  DIMENSIONS (\n    clients.customer_name AS CUSTOMER_NAME\n      WITH SYNONYMS = ('client', 'client name', 'company')\n      COMMENT = 'Registered legal entity name (upper case)',\n    clients.sector        AS SECTOR WITH SYNONYMS = ('industry'),\n    clients.country       AS COUNTRY COMMENT = 'ISO alpha-3 country code',\n    clients.kyc_status    AS KYC_STATUS COMMENT = 'APPROVED, PENDING_REVIEW, EXPIRED',\n    clients.rm_name       AS RM_NAME WITH SYNONYMS = ('relationship manager', 'RM', 'banker'),\n    clients.rm_team       AS RM_TEAM COMMENT = 'Corporate, Institutional or SME banking team',\n    feedback.sentiment_label AS SENTIMENT_LABEL COMMENT = 'POSITIVE, NEUTRAL, NEGATIVE',\n    feedback.topic_category  AS TOPIC_CATEGORY,\n    feedback.feedback_payment_type AS PAYMENT_TYPE COMMENT = 'Payment scheme the feedback refers to',\n    feedback.feedback_date   AS FEEDBACK_DATE,\n    alerts.severity       AS SEVERITY COMMENT = 'LOW, MEDIUM, HIGH, CRITICAL',\n    alerts.alert_status   AS ALERT_STATUS COMMENT = 'OPEN, ACKNOWLEDGED, INVESTIGATING, RESOLVED',\n    alerts.alert_time     AS ALERT_TIME\n  )\n\n  METRICS (\n    payments.payment_count     AS SUM(payments.total_payments) WITH SYNONYMS = ('number of payments'),\n    payments.payment_volume    AS SUM(payments.total_volume_gbp) WITH SYNONYMS = ('volume', 'value'),\n    payments.failed_volume     AS SUM(payments.failed_volume_gbp) WITH SYNONYMS = ('value at risk'),\n    payments.success_rate_pct  AS ROUND(SUM(payments.successful_payments) / NULLIF(SUM(payments.total_payments), 0) * 100, 2)\n      COMMENT = 'Weighted payment success rate %',\n    feedback.avg_sentiment     AS ROUND(AVG(feedback.sentiment_score), 3),\n    feedback.negative_feedback_count AS COUNT_IF(feedback.sentiment_label = 'NEGATIVE'),\n    alerts.open_alert_count    AS COUNT_IF(alerts.alert_status <> 'RESOLVED') WITH SYNONYMS = ('open incidents'),\n    alerts.critical_alert_count AS COUNT_IF(alerts.severity = 'CRITICAL'),\n    alerts.avg_resolution_min  AS ROUND(AVG(alerts.resolution_time_min), 0)\n  )\n\n  COMMENT = 'Corporate Client 360 for Payments Operations: payments health, feedback sentiment and operational alerts per client'\n\n  AI_SQL_GENERATION 'Client names are stored in upper case; match them case-insensitively with ILIKE. Round percentages to 1 decimal place.'\n\n  AI_VERIFIED_QUERIES (\n    worst_clients AS (\n      QUESTION 'Which 5 clients have the lowest payment success rate?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT c.CUSTOMER_NAME, ROUND(SUM(p.SUCCESSFUL_PAYMENTS) / NULLIF(SUM(p.TOTAL_PAYMENTS), 0) * 100, 2) AS success_rate_pct\n           FROM BARCLAYS_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY p\n           JOIN BARCLAYS_HOL.ANALYTICS.STG_CUSTOMERS c ON p.CUSTOMER_ID = c.CUSTOMER_ID\n           GROUP BY c.CUSTOMER_NAME ORDER BY success_rate_pct ASC LIMIT 5'\n    ),\n    rm_open_alerts AS (\n      QUESTION 'How many open alerts does each relationship manager have across their clients?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT c.RM_NAME, COUNT_IF(a.ALERT_STATUS <> ''RESOLVED'') AS open_alerts\n           FROM BARCLAYS_HOL.ANALYTICS.V_CLIENT_ALERTS a\n           JOIN BARCLAYS_HOL.ANALYTICS.STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n           GROUP BY c.RM_NAME ORDER BY open_alerts DESC'\n    )\n  );\n\nSHOW SEMANTIC METRICS IN SV_CLIENT_360;\n\n-- -----------------------------------------------------\n-- DA1.3 Query the semantic view with SQL (no joins to remember)\n-- -----------------------------------------------------\nSELECT * FROM SEMANTIC_VIEW(\n    SV_CLIENT_360\n    DIMENSIONS clients.rm_name\n    METRICS payments.payment_volume, payments.success_rate_pct, alerts.open_alert_count\n) ORDER BY open_alert_count DESC;\n\n-- -----------------------------------------------------\n-- DA1.4 Ask in plain English (Cortex Analyst)\n-- Snowsight: AI & ML > Cortex Analyst > SV_CLIENT_360, or in Snowflake Intelligence after OPS1.\n-- Try:\n--   \"Which clients in Manufacturing have open critical alerts?\"\n--   \"Compare success rate and average sentiment for each RM team\"\n--   \"Which client has the most failed payment value and what are they complaining about?\"\n-- Check the generated SQL each time - that is the point of a trusted semantic layer.\n-- -----------------------------------------------------\n\nSELECT 'DA1 complete' AS STATUS;\n", "sql_name": "vignettes/da1_semantic_view_analyst/da1.sql"}, {"code": "DA2", "title": "AI SQL on customer feedback", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code> (or DE1)<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>da2.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>What are corporate clients actually complaining about, by scheme and by relationship manager - without reading 2,000 comments?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>FEEDBACK_ENRICHED<\/code> (sentiment + topic)<\/li>\n<li><code>RM_FEEDBACK_THEMES<\/code> (AI_AGG themes and actions per RM)<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Aspect sentiment with <code>AI_SENTIMENT<\/code>.<\/li>\n<li>Enrich all feedback with sentiment and <code>AI_CLASSIFY<\/code> topics.<\/li>\n<li>Natural-language filtering with <code>AI_FILTER<\/code> (churn risk).<\/li>\n<li>Per-RM complaint themes with <code>AI_AGG<\/code>.<\/li>\n<li>Draft a client reply with <code>AI_COMPLETE<\/code>.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Show which customer sectors have worsening sentiment month over month and chart it.&quot;<\/em><\/li>\n<li><em>&quot;Use AI_EXTRACT on FEEDBACK_TEXT to pull out payment references or amounts into FEEDBACK_ENTITIES.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p><code>RM_FEEDBACK_THEMES<\/code> has one row per RM with three themes and actions.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>AI functions run inside Snowflake&#x27;s security boundary - no data leaves the platform and nothing is vectorised or stored by the model.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DA2: AI SQL ON CUSTOMER FEEDBACK   (~45 min)\n-- Persona: Data Analyst\n-- Question: \"What are corporate clients actually complaining about, by\n--            scheme and by relationship manager - without reading 2,000 comments?\"\n-- Prereq:   setup/catchup/core_analytics.sql (for STG_* views), or DE1\n-- All functions run inside Snowflake: no data leaves the platform, no model training.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DA2.1 Overall and aspect-based sentiment\n-- AI_SENTIMENT scores the whole text and named aspects separately\n-- -----------------------------------------------------\nSELECT LEFT(FEEDBACK_TEXT, 90) AS FEEDBACK,\n       AI_SENTIMENT(FEEDBACK_TEXT, ['speed', 'communication', 'fees']) AS ASPECT_SENTIMENT\nFROM STG_FEEDBACK\nLIMIT 5;\n\n-- -----------------------------------------------------\n-- DA2.2 Build the enriched feedback table (score once, query many times)\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE FEEDBACK_ENRICHED AS\nWITH ai_scored AS (\n    SELECT f.*, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           ROUND(SNOWFLAKE.CORTEX.SENTIMENT(f.FEEDBACK_TEXT), 3) AS SENTIMENT_SCORE,\n           AI_CLASSIFY(f.FEEDBACK_TEXT,\n               ['Performance Issue','Service Quality','Technical Problem',\n                'Positive Experience','Feature Request']) AS CLASSIFICATION_RESULT\n    FROM STG_FEEDBACK f\n    LEFT JOIN STG_CUSTOMERS c ON f.CUSTOMER_ID = c.CUSTOMER_ID\n)\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR, RM_NAME,\n       PAYMENT_ID, FEEDBACK_CHANNEL, FEEDBACK_TEXT, PAYMENT_TYPE, RATING, SENTIMENT_SCORE,\n       CASE WHEN SENTIMENT_SCORE >  0.3 THEN 'POSITIVE'\n            WHEN SENTIMENT_SCORE < -0.3 THEN 'NEGATIVE'\n            ELSE 'NEUTRAL' END                  AS SENTIMENT_LABEL,\n       CLASSIFICATION_RESULT:labels[0]::STRING  AS TOPIC_CATEGORY\nFROM ai_scored;\n\nSELECT PAYMENT_TYPE, COUNT(*) AS FEEDBACK,\n       ROUND(AVG(SENTIMENT_SCORE), 3) AS AVG_SENTIMENT,\n       ROUND(COUNT_IF(SENTIMENT_LABEL = 'NEGATIVE') / COUNT(*) * 100, 1) AS NEGATIVE_PCT\nFROM FEEDBACK_ENRICHED\nGROUP BY PAYMENT_TYPE ORDER BY AVG_SENTIMENT;\n\n-- -----------------------------------------------------\n-- DA2.3 AI_FILTER: natural-language WHERE clause\n-- -----------------------------------------------------\nSELECT CUSTOMER_NAME, PAYMENT_TYPE, LEFT(FEEDBACK_TEXT, 120) AS FEEDBACK\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE'\n  AND AI_FILTER(PROMPT('Does this feedback mention a risk of the client moving their business elsewhere? {0}', FEEDBACK_TEXT))\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- DA2.4 AI_AGG: themes across many rows, per relationship manager\n-- One LLM summary per group - no row limit, no prompt stuffing\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE RM_FEEDBACK_THEMES AS\nSELECT RM_NAME,\n       COUNT(*) AS NEGATIVE_FEEDBACK,\n       AI_AGG(FEEDBACK_TEXT,\n              'You are briefing a corporate banking relationship manager. List the top 3 recurring complaint themes in this client feedback, each with a one-line recommended action. Be concise.') AS TOP_THEMES\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE' AND RM_NAME IS NOT NULL\nGROUP BY RM_NAME;\n\nSELECT RM_NAME, NEGATIVE_FEEDBACK, TOP_THEMES FROM RM_FEEDBACK_THEMES ORDER BY NEGATIVE_FEEDBACK DESC;\n\n-- -----------------------------------------------------\n-- DA2.5 AI_COMPLETE: draft a client-ready response for the worst item\n-- -----------------------------------------------------\nSELECT CUSTOMER_NAME, FEEDBACK_TEXT,\n       AI_COMPLETE('claude-sonnet-4-5',\n         'Draft a short, professional reply from a UK corporate bank to this client feedback. Acknowledge the issue, avoid admitting liability, offer a follow-up call. Feedback: ' || FEEDBACK_TEXT) AS DRAFT_REPLY\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE'\nORDER BY SENTIMENT_SCORE\nLIMIT 1;\n\n-- -----------------------------------------------------\n-- DA2.6 Cortex Code prompts\n--  \"Using FEEDBACK_ENRICHED, show me which customer sectors have worsening\n--   sentiment month over month and chart it.\"\n--  \"Use AI_EXTRACT on FEEDBACK_TEXT to pull out any payment reference or amount\n--   mentioned, into a new table FEEDBACK_ENTITIES.\"\n-- -----------------------------------------------------\n\nSELECT 'DA2 complete' AS STATUS;\n", "sql_name": "vignettes/da2_aisql_feedback/da2.sql"}, {"code": "OPS1", "title": "Corporate Payments 360 agent", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Payments Ops analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>core_analytics.sql<\/code>, DA1 (<code>SV_CLIENT_360<\/code>), <code>semantic_view_and_agent.sql<\/code> (<code>SV_PAYMENTS<\/code>)<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>ops1.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Before I call a client, tell me everything: payments health, open incidents and what they have been complaining about.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Agent <code>SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360<\/code> with two Analyst tools and charting<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Create the agent (SQL or Snowsight <strong>AI &amp; ML &gt; Agents<\/strong>).<\/li>\n<li>Open Snowflake Intelligence / CoWork and run the four sample questions.<\/li>\n<li>Expand <strong>Show details<\/strong> to see which tool and SQL were used.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Add a sample question to CORPORATE_PAYMENTS_360 for weekly CHAPS volume and update its orchestration instructions.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>&quot;Brief me on the client with the most failed payment value&quot; returns a briefing naming the client, failed value, open/critical alerts and feedback topic.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Agents run with the caller&#x27;s role, so RM-level entitlements (GOV1) apply automatically.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE OPS1: CORPORATE PAYMENTS 360 AGENT   (~45 min)\n-- Persona: Payments Operations analyst (no SQL needed after setup)\n-- Question: \"Before I call a client, tell me everything: payments health,\n--            open incidents, and what they have been complaining about.\"\n-- Prereq:   setup/catchup/core_analytics.sql + DA1 (SV_CLIENT_360)\n--           + setup/catchup/semantic_view_and_agent.sql (SV_PAYMENTS)\n--           Facilitator shortcut: run all three catch-up/DA1 scripts in order.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\n\n-- -----------------------------------------------------\n-- OPS1.1 The agent: two semantic views as tools + charting\n-- Created in SNOWFLAKE_INTELLIGENCE.AGENTS so it appears in Snowflake\n-- Intelligence / CoWork for everyone with access.\n-- (Snowsight alternative: AI & ML > Agents > Create agent - same settings.)\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360\n  COMMENT = 'Barclays HOL - Corporate Payments 360: client payments health, incidents and sentiment'\n  PROFILE = '{\"display_name\": \"Corporate Payments 360\", \"color\": \"blue\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n\n  orchestration:\n    budget:\n      seconds: 90\n      tokens: 20000\n\n  instructions:\n    response: >\n      You support Payments Operations and Relationship Managers in a UK corporate bank.\n      Lead with a one-line summary, then the supporting numbers.\n      Format money in GBP with thousands separators and percentages to 1 decimal place.\n      When briefing on a client, always cover: payment volume and success rate,\n      failed value, open and critical alerts, and feedback sentiment with the main topic.\n      If the data cannot answer the question, say so - never guess.\n    orchestration: >\n      Use Client360 for anything about a specific client, relationship manager,\n      KYC status, alerts or incidents, and client feedback.\n      Use PaymentsOps for scheme-level and daily trends: volumes by scheme/region/channel,\n      processing times, P95 latency and SLA compliance or breaches.\n      For a client briefing you may need Client360 more than once.\n    sample_questions:\n      - question: \"Brief me on the client with the most failed payment value\"\n      - question: \"Which relationship managers have the most open critical alerts?\"\n      - question: \"Which payment schemes breached SLA most often in the last 30 days?\"\n      - question: \"Show weekly payment volume for CHAPS as a chart\"\n\n  tools:\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: Client360\n        description: >\n          Corporate client 360: one row per client with sector, country, KYC status and RM;\n          payment totals, success rate and failed value per client; AI-scored feedback\n          sentiment and topic; and operational alerts with severity, status and resolution time.\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: PaymentsOps\n        description: >\n          Daily payment KPIs by scheme (CHAPS, Faster Payments, BACS, SWIFT, SEPA, Wire),\n          region, channel, sector and RM, plus daily SLA compliance status per scheme.\n    - tool_spec:\n        type: data_to_chart\n        name: data_to_chart\n        description: Generates charts from query results\n\n  tool_resources:\n    Client360:\n      semantic_view: BARCLAYS_HOL.ANALYTICS.SV_CLIENT_360\n      execution_environment:\n        type: warehouse\n        warehouse: BARCLAYS_WH\n    PaymentsOps:\n      semantic_view: BARCLAYS_HOL.ANALYTICS.SV_PAYMENTS\n      execution_environment:\n        type: warehouse\n        warehouse: BARCLAYS_WH\n  $$;\n\n-- -----------------------------------------------------\n-- OPS1.2 Use it - Snowflake Intelligence (ai.snowflake.com) or CoWork\n-- Select \"Corporate Payments 360\" and try:\n--   1. \"Brief me on the client with the most failed payment value\"\n--   2. \"Which of Priya Sharma's clients have open critical alerts?\"\n--   3. \"Is SWIFT meeting its SLA this month? Show a chart.\"\n--   4. \"Which clients have negative sentiment AND a success rate below 96%?\"\n-- Expand \"Show details\" on each answer to see the tool and SQL used.\n-- -----------------------------------------------------\n\n-- OPS1.3 The same agent from SQL (e.g. embedding in a process or app)\nSELECT SNOWFLAKE.CORTEX.DATA_AGENT_RUN(\n  'SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360',\n  $${\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"Which relationship managers have the most open critical alerts?\"}]}]}$$\n) AS RESPONSE;\n\n-- Barclayflake note: agents inherit the caller's role - an RM only ever\n-- sees what their role is granted (see GOV1 for masking and row access).\n\nSELECT 'OPS1 complete' AS STATUS;\n", "sql_name": "vignettes/ops1_payments_360_agent/ops1.sql"}, {"code": "OPS2", "title": "Alert triage + negative sentiment feed", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Payments Ops analyst / team lead<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>ops2.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Which open alerts should my team work first, what should we do, and which unhappy clients are linked to them?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>DT_NEGATIVE_SENTIMENT_FEED<\/code><\/li>\n<li><code>V_ALERT_TRIAGE_QUEUE<\/code> with an explainable priority score<\/li>\n<li><code>ALERT_RECOMMENDATIONS<\/code> (AI next actions for the top 10)<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Create the negative-sentiment dynamic table.<\/li>\n<li>Build and review the prioritised triage queue.<\/li>\n<li>Generate recommended actions with <code>AI_COMPLETE<\/code>.<\/li>\n<li>Optionally add a Triage page to the Streamlit dashboard with CoCo.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Add a &#x27;Triage&#x27; page to the Streamlit app showing V_ALERT_TRIAGE_QUEUE with ALERT_RECOMMENDATIONS alongside.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>The top recommendation for a critical compliance-hold alert says not to retry and to escalate.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Recommendations are decision support for an analyst, not automated actions.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE OPS2: ALERT TRIAGE + NEGATIVE SENTIMENT FEED   (~30 min)\n-- Persona: Payments Operations analyst / team lead\n-- Question: \"Which open alerts should my team work first, what should we do,\n--            and which unhappy clients are linked to them?\"\n-- Prereq:   setup/catchup/core_analytics.sql (FEEDBACK_ENRICHED, STG_* views)\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- OPS2.1 Live negative-sentiment feed for the CX escalation queue\n-- -----------------------------------------------------\nCREATE OR REPLACE DYNAMIC TABLE DT_NEGATIVE_SENTIMENT_FEED\n    TARGET_LAG = '5 minutes'\n    WAREHOUSE  = BARCLAYS_WH\nAS\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR,\n       RM_NAME, PAYMENT_ID, PAYMENT_TYPE, FEEDBACK_TEXT, SENTIMENT_SCORE, TOPIC_CATEGORY\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE';\n\n-- -----------------------------------------------------\n-- OPS2.2 Prioritised triage queue: open alerts, scored for urgency\n-- -----------------------------------------------------\nCREATE OR REPLACE VIEW V_ALERT_TRIAGE_QUEUE AS\nSELECT al.ALERT_ID, al.ALERT_TIME, al.SEVERITY, al.STATUS, al.ASSIGNED_TO,\n       al.PAYMENT_TYPE, al.ALERT_DESCRIPTION,\n       p.PAYMENT_ID, p.AMOUNT, p.CURRENCY, p.STATUS AS PAYMENT_STATUS,\n       e.ERROR_CODE, e.ERROR_DESCRIPTION, e.ERROR_CATEGORY, e.IS_RETRYABLE,\n       c.CUSTOMER_NAME, c.RM_NAME,\n       COUNT(n.FEEDBACK_ID) AS CLIENT_NEGATIVE_FEEDBACK,\n       -- simple, explainable priority score\n       DECODE(al.SEVERITY, 'CRITICAL', 40, 'HIGH', 25, 'MEDIUM', 10, 0)\n         + IFF(p.AMOUNT >= 1000000, 30, IFF(p.AMOUNT >= 100000, 15, 0))\n         + LEAST(COUNT(n.FEEDBACK_ID), 20)\n         + IFF(e.ERROR_CATEGORY = 'COMPLIANCE', 10, 0)        AS PRIORITY_SCORE\nFROM BARCLAYS_HOL.RAW_DATA.OPERATIONAL_ALERTS al\nJOIN STG_PAYMENTS p          ON al.PAYMENT_ID = p.PAYMENT_ID\nLEFT JOIN BARCLAYS_HOL.RAW_DATA.ERROR_CODES e ON p.ERROR_CODE = e.ERROR_CODE\nLEFT JOIN STG_ACCOUNTS a     ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nLEFT JOIN STG_CUSTOMERS c    ON a.CUSTOMER_ID = c.CUSTOMER_ID\nLEFT JOIN DT_NEGATIVE_SENTIMENT_FEED n ON n.CUSTOMER_ID = c.CUSTOMER_ID\nWHERE al.STATUS <> 'RESOLVED'\nGROUP BY ALL;\n\nSELECT ALERT_ID, SEVERITY, PAYMENT_TYPE, AMOUNT, ERROR_DESCRIPTION, CUSTOMER_NAME,\n       CLIENT_NEGATIVE_FEEDBACK, PRIORITY_SCORE\nFROM V_ALERT_TRIAGE_QUEUE\nORDER BY PRIORITY_SCORE DESC\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- OPS2.3 AI-recommended next action for the top of the queue\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE ALERT_RECOMMENDATIONS AS\nSELECT ALERT_ID, SEVERITY, PAYMENT_TYPE, CUSTOMER_NAME, RM_NAME, PRIORITY_SCORE,\n       AI_COMPLETE('claude-sonnet-4-5',\n         'You are a senior payments operations analyst at a UK bank. In at most 3 short bullet points, '\n         || 'give the next actions for this alert, including whether to retry the payment and whether to contact the client or their RM. '\n         || 'Alert: ' || ALERT_DESCRIPTION\n         || ' | Scheme: ' || PAYMENT_TYPE\n         || ' | Error: ' || COALESCE(ERROR_DESCRIPTION, 'none') || ' (' || COALESCE(ERROR_CATEGORY, 'n/a')\n         || ', retryable=' || COALESCE(IS_RETRYABLE::STRING, 'unknown') || ')'\n         || ' | Amount: ' || AMOUNT || ' ' || CURRENCY\n         || ' | Client negative feedback items: ' || CLIENT_NEGATIVE_FEEDBACK) AS RECOMMENDED_ACTION\nFROM V_ALERT_TRIAGE_QUEUE\nORDER BY PRIORITY_SCORE DESC\nLIMIT 10;\n\nSELECT ALERT_ID, SEVERITY, CUSTOMER_NAME, RECOMMENDED_ACTION\nFROM ALERT_RECOMMENDATIONS ORDER BY PRIORITY_SCORE DESC;\n\n-- -----------------------------------------------------\n-- OPS2.4 Hand it to the business\n--  * Add V_ALERT_TRIAGE_QUEUE to SV_CLIENT_360 (ask CoCo to extend DA1's view), or\n--  * Open payments-dashboard/ (Streamlit) and ask CoCo:\n--    \"Add a 'Triage' page to the Streamlit app that shows V_ALERT_TRIAGE_QUEUE\n--     ordered by PRIORITY_SCORE with ALERT_RECOMMENDATIONS alongside.\"\n-- -----------------------------------------------------\n\nSELECT 'OPS2 complete' AS STATUS;\n", "sql_name": "vignettes/ops2_alert_triage/ops2.sql"}, {"code": "AI1", "title": "Agent with custom tools", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>core_analytics.sql<\/code>, <code>semantic_view_and_agent.sql<\/code><\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>ai1.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Ops staff ask about specific payments by ID and about scheme rules - not just aggregates. Give the agent precise tools.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>UDF tools <code>PAYMENT_LOOKUP<\/code>, <code>SCHEME_RULES<\/code><\/li>\n<li>Agent <code>BARCLAYS_HOL.AGENTS.PAYMENTS_INVESTIGATOR<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Create and test the two UDFs.<\/li>\n<li>Create the agent with generic (function) tools plus Analyst.<\/li>\n<li>Test in the agent playground with a real failed payment ID.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Add a third tool to PAYMENTS_INVESTIGATOR that lists open alerts for a customer name, using a new UDF.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>Asking about a failed CHAPS payment calls <code>PaymentLookup<\/code> then <code>SchemeRules<\/code> and reports retryability and the 15:45 cutoff.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Deterministic tools for lookups keep answers exact and auditable; text-to-SQL is reserved for analytical questions.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE AI1: AGENT WITH CUSTOM TOOLS   (~45 min)\n-- Persona: AI Builder\n-- Question: \"Ops staff ask about specific payments by ID and about scheme\n--            rules - not just aggregates. Give the agent precise tools.\"\n-- Prereq:   setup/catchup/core_analytics.sql + setup/catchup/semantic_view_and_agent.sql\n-- Builds:   2 UDF tools + PAYMENTS_INVESTIGATOR agent\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.AGENTS;\n\n-- -----------------------------------------------------\n-- AI1.1 Tool 1: exact payment lookup (deterministic - no text-to-SQL guessing)\n-- -----------------------------------------------------\nCREATE OR REPLACE FUNCTION GET_PAYMENT_DETAILS(PAYMENT_ID_IN VARCHAR)\nRETURNS TABLE (PAYMENT_ID VARCHAR, PAYMENT_DATE TIMESTAMP, PAYMENT_TYPE VARCHAR,\n               AMOUNT NUMBER(15,2), CURRENCY VARCHAR, STATUS VARCHAR,\n               PROCESSING_TIME_MS NUMBER, ERROR_CODE VARCHAR, ERROR_DESCRIPTION VARCHAR,\n               IS_RETRYABLE BOOLEAN, CUSTOMER_NAME VARCHAR, RM_NAME VARCHAR,\n               OPEN_ALERTS NUMBER)\nCOMMENT = 'Look up one payment by PAYMENT_ID with its error, client, RM and open alert count'\nAS\n$$\n    SELECT p.PAYMENT_ID, p.PAYMENT_DATE, p.PAYMENT_TYPE, p.AMOUNT, p.CURRENCY, p.STATUS,\n           p.PROCESSING_TIME_MS, p.ERROR_CODE, e.ERROR_DESCRIPTION, e.IS_RETRYABLE,\n           c.CUSTOMER_NAME, c.RM_NAME,\n           (SELECT COUNT(*) FROM BARCLAYS_HOL.RAW_DATA.OPERATIONAL_ALERTS al\n             WHERE al.PAYMENT_ID = p.PAYMENT_ID AND al.STATUS <> 'RESOLVED')\n    FROM BARCLAYS_HOL.ANALYTICS.STG_PAYMENTS p\n    LEFT JOIN BARCLAYS_HOL.RAW_DATA.ERROR_CODES e  ON p.ERROR_CODE = e.ERROR_CODE\n    LEFT JOIN BARCLAYS_HOL.ANALYTICS.STG_ACCOUNTS a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\n    LEFT JOIN BARCLAYS_HOL.ANALYTICS.STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n    WHERE p.PAYMENT_ID = UPPER(TRIM(PAYMENT_ID_IN))\n$$;\n\n-- Agent custom tools need a scalar return - wrap the table function as JSON\nCREATE OR REPLACE FUNCTION PAYMENT_LOOKUP(PAYMENT_ID VARCHAR)\nRETURNS VARIANT\nCOMMENT = 'Agent tool: payment details as JSON'\nAS\n$$\n    SELECT COALESCE(ARRAY_AGG(OBJECT_CONSTRUCT(*))[0],\n                    OBJECT_CONSTRUCT('error', 'No payment found with ID ' || PAYMENT_ID))\n    FROM TABLE(GET_PAYMENT_DETAILS(PAYMENT_ID))\n$$;\n\nSELECT PAYMENT_LOOKUP((SELECT MIN(PAYMENT_ID) FROM BARCLAYS_HOL.RAW_DATA.PAYMENTS WHERE STATUS = 'FAILED')) AS RESULT;\n\n-- -----------------------------------------------------\n-- AI1.2 Tool 2: scheme rules (\"can I still send this today?\")\n-- -----------------------------------------------------\nCREATE OR REPLACE FUNCTION SCHEME_RULES(SCHEME VARCHAR)\nRETURNS VARIANT\nCOMMENT = 'Agent tool: payment scheme rules - settlement cycle, value limit, cutoff and SLA'\nAS\n$$\n    SELECT COALESCE(ARRAY_AGG(OBJECT_CONSTRUCT(\n               'scheme', s.SCHEME_CODE, 'name', s.SCHEME_NAME,\n               'settlement_cycle', s.SETTLEMENT_CYCLE, 'domestic', s.IS_DOMESTIC,\n               'max_value_gbp', s.MAX_VALUE_GBP, 'cutoff_time_uk', s.CUTOFF_TIME::STRING,\n               'currency', s.OPERATING_CURRENCY,\n               'sla_target_success_rate', sla.TARGET_SUCCESS_RATE,\n               'sla_max_p95_ms', sla.MAX_PROCESSING_TIME_MS))[0],\n             OBJECT_CONSTRUCT('error', 'Unknown scheme. Valid: CHAPS, FASTER_PAYMENTS, BACS, SWIFT, SEPA, WIRE_TRANSFER'))\n    FROM BARCLAYS_HOL.RAW_DATA.PAYMENT_SCHEMES s\n    LEFT JOIN BARCLAYS_HOL.RAW_DATA.SLA_DEFINITIONS sla ON sla.PAYMENT_TYPE = s.SCHEME_CODE\n    WHERE s.SCHEME_CODE = UPPER(REPLACE(TRIM(SCHEME), ' ', '_'))\n$$;\n\nSELECT SCHEME_RULES('chaps') AS RESULT;\n\n-- -----------------------------------------------------\n-- AI1.3 The agent: Analyst for aggregates + custom tools for precision\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT BARCLAYS_HOL.AGENTS.PAYMENTS_INVESTIGATOR\n  COMMENT = 'Barclays HOL - investigates individual payments and scheme rules, plus KPI questions'\n  PROFILE = '{\"display_name\": \"Payments Investigator\", \"color\": \"green\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: >\n      You help payments operations investigate individual payments. Be precise and brief.\n      When reporting a payment, state status, error and whether it is retryable first.\n    orchestration: >\n      If the user gives a payment ID (format PAY followed by digits), call PaymentLookup.\n      For questions about a scheme's cutoff, limit, settlement cycle or SLA, call SchemeRules.\n      For counts, volumes, trends or comparisons, use PaymentsOps.\n      You can chain tools, e.g. look up a payment then check its scheme's cutoff.\n  tools:\n    - tool_spec:\n        type: generic\n        name: PaymentLookup\n        description: Returns full details for a single payment ID, including error, retryability, client, RM and open alerts.\n        input_schema:\n          type: object\n          properties:\n            payment_id:\n              type: string\n              description: The payment ID, e.g. PAY0000000123\n          required: [payment_id]\n    - tool_spec:\n        type: generic\n        name: SchemeRules\n        description: Returns rules for a payment scheme - settlement cycle, max value, daily cutoff time and SLA targets.\n        input_schema:\n          type: object\n          properties:\n            scheme:\n              type: string\n              description: One of CHAPS, FASTER_PAYMENTS, BACS, SWIFT, SEPA, WIRE_TRANSFER\n          required: [scheme]\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: PaymentsOps\n        description: Aggregated daily payment KPIs and SLA compliance by scheme, region, channel, sector and RM.\n  tool_resources:\n    PaymentLookup:\n      type: function\n      identifier: BARCLAYS_HOL.AGENTS.PAYMENT_LOOKUP\n      execution_environment:\n        type: warehouse\n        warehouse: BARCLAYS_WH\n    SchemeRules:\n      type: function\n      identifier: BARCLAYS_HOL.AGENTS.SCHEME_RULES\n      execution_environment:\n        type: warehouse\n        warehouse: BARCLAYS_WH\n    PaymentsOps:\n      semantic_view: BARCLAYS_HOL.ANALYTICS.SV_PAYMENTS\n      execution_environment:\n        type: warehouse\n        warehouse: BARCLAYS_WH\n  $$;\n\n-- -----------------------------------------------------\n-- AI1.4 Test (Snowsight: AI & ML > Agents > PAYMENTS_INVESTIGATOR > Playground)\n-- Grab a failed payment ID to ask about:\nSELECT PAYMENT_ID, PAYMENT_TYPE, AMOUNT FROM BARCLAYS_HOL.RAW_DATA.PAYMENTS WHERE STATUS = 'FAILED' LIMIT 3;\n-- Try:\n--   \"What happened to payment <ID>? Can we retry it, and is there still time before the scheme cutoff today?\"\n--   \"What's the maximum value for Faster Payments, and how many failed last week?\"\n-- CoCo prompt: \"Add a third tool to PAYMENTS_INVESTIGATOR that lists the open alerts\n--   for a given customer name, using a new UDF in BARCLAYS_HOL.AGENTS.\"\n-- -----------------------------------------------------\n\nSELECT 'AI1 complete' AS STATUS;\n", "sql_name": "vignettes/ai1_agent_tools/ai1.sql"}, {"code": "AI2", "title": "Snowflake-managed MCP server", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DA1, OPS1, AI1 and the knowledge extension from facilitator setup<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>ai2.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Teams use different AI clients. Expose governed payments tools to all of them once.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>MCP server <code>BARCLAYS_HOL.AGENTS.PAYMENTS_MCP<\/code> with Analyst, Agent, UDF and knowledge-extension tools<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Create the MCP server.<\/li>\n<li>Get the endpoint URL and create a short-lived PAT for <code>HOL_PARTICIPANT<\/code>.<\/li>\n<li>Connect Cortex Code (or another MCP client) and call the tools.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Using the barclays-payments tools, which clients have open critical alerts?&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>Your MCP client lists <code>client-360-analyst<\/code>, <code>payments-360-agent<\/code>, <code>payment-lookup<\/code> and <code>snowflake-docs<\/code>.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>MCP is approved this quarter. Control reach with <code>GRANT USAGE ON MCP SERVER<\/code>; every call runs as the caller&#x27;s role.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE AI2: SNOWFLAKE-MANAGED MCP SERVER   (~30 min)\n-- Persona: AI Builder\n-- Question: \"Our teams use different AI clients (Cortex Code, Claude, Copilot,\n--            in-house apps). Expose governed payments tools to all of them once.\"\n-- Prereq:   DA1 (SV_CLIENT_360), OPS1 (CORPORATE_PAYMENTS_360), AI1 (PAYMENT_LOOKUP)\n--           and the Marketplace knowledge extension installed by facilitator setup.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\nUSE SCHEMA BARCLAYS_HOL.AGENTS;\n\n-- -----------------------------------------------------\n-- AI2.1 One server, four governed tools. No infrastructure to host.\n-- Every call runs as the calling user's role - RBAC, masking and row\n-- access policies all still apply.\n-- -----------------------------------------------------\nCREATE OR REPLACE MCP SERVER PAYMENTS_MCP\n  FROM SPECIFICATION $$\n    tools:\n      - name: \"client-360-analyst\"\n        type: \"CORTEX_ANALYST_MESSAGE\"\n        identifier: \"BARCLAYS_HOL.ANALYTICS.SV_CLIENT_360\"\n        title: \"Corporate Client 360\"\n        description: \"Ask natural-language questions about corporate clients: payment volumes, success rates, failed value, alerts and feedback sentiment.\"\n\n      - name: \"payments-360-agent\"\n        type: \"CORTEX_AGENT_RUN\"\n        identifier: \"SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360\"\n        title: \"Corporate Payments 360 Agent\"\n        description: \"Full client briefings combining client 360 and scheme-level payments operations data.\"\n        annotations:\n          readOnlyHint: true\n          openWorldHint: false\n\n      - name: \"payment-lookup\"\n        type: \"GENERIC\"\n        identifier: \"BARCLAYS_HOL.AGENTS.PAYMENT_LOOKUP\"\n        title: \"Payment Lookup\"\n        description: \"Returns full details for one payment ID: status, error, retryability, client, RM and open alerts.\"\n        annotations:\n          readOnlyHint: true\n          destructiveHint: false\n          idempotentHint: true\n          openWorldHint: false\n        config:\n          type: \"function\"\n          warehouse: \"BARCLAYS_WH\"\n          input_schema:\n            type: \"object\"\n            properties:\n              payment_id:\n                description: \"Payment ID, e.g. PAY0000000123\"\n                type: \"string\"\n\n      - name: \"snowflake-docs\"\n        type: \"CORTEX_SEARCH_SERVICE_QUERY\"\n        identifier: \"SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE\"\n        title: \"Snowflake Documentation (Knowledge Extension)\"\n        description: \"Search official Snowflake documentation. Provider-hosted Marketplace Knowledge Extension - no internal data is indexed.\"\n  $$;\n\nSHOW MCP SERVERS IN SCHEMA BARCLAYS_HOL.AGENTS;\nDESCRIBE MCP SERVER PAYMENTS_MCP;\n\n-- -----------------------------------------------------\n-- AI2.2 Connect a client\n-- Endpoint:\n--   https://<account_url>/api/v2/databases/BARCLAYS_HOL/schemas/AGENTS/mcp-servers/PAYMENTS_MCP\n-- Find <account_url>:\nSELECT REPLACE(LOWER(CURRENT_ORGANIZATION_NAME() || '-' || CURRENT_ACCOUNT_NAME()), '_', '-') || '.snowflakecomputing.com' AS ACCOUNT_URL;\n--\n-- Cortex Code (CLI / Desktop) - add to your MCP settings:\n--   {\n--     \"mcpServers\": {\n--       \"barclays-payments\": {\n--         \"type\": \"http\",\n--         \"url\": \"https://<account_url>/api/v2/databases/BARCLAYS_HOL/schemas/AGENTS/mcp-servers/PAYMENTS_MCP\",\n--         \"headers\": { \"Authorization\": \"Bearer <PAT>\" }\n--       }\n--     }\n--   }\n-- Create a short-lived PAT restricted to HOL_PARTICIPANT (Snowsight: Settings >\n-- Authentication > Programmatic access tokens) or use OAuth for production.\n--\n-- Then ask your client:\n--   \"Using the barclays-payments tools, which clients have open critical alerts?\"\n--   \"Look up payment <ID> and tell me if it can be retried.\"\n--   \"How do I create a dynamic table? Check the Snowflake docs tool.\"\n-- -----------------------------------------------------\n\n-- Barclayflake note: the MCP server is a schema object - grant USAGE on it\n-- only to roles that should reach these tools:\n--   GRANT USAGE ON MCP SERVER BARCLAYS_HOL.AGENTS.PAYMENTS_MCP TO ROLE <consumer_role>;\n\nSELECT 'AI2 complete' AS STATUS;\n", "sql_name": "vignettes/ai2_mcp_server/ai2.sql"}, {"code": "AI3", "title": "Marketplace knowledge extension (instead of Cortex Search)", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Facilitator setup 00 (installs <code>SNOWFLAKE_DOCS_CKE<\/code>), DA1<\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>ai3.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Agents need trusted unstructured knowledge, but internal (PII) data cannot be vectorised yet. What can we do?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Agent <code>SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT<\/code> combining <code>SV_CLIENT_360<\/code> with a provider-hosted search service<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Inspect the installed Cortex Knowledge Extension - note you did not build it.<\/li>\n<li>Query it with <code>SEARCH_PREVIEW<\/code>.<\/li>\n<li>Create an agent that uses both internal data and the extension.<\/li>\n<li>Ask a question that needs both.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Which 3 clients have the most open critical alerts, and how could I build a dynamic table to keep that list up to date?&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>The agent calls both <code>Client360<\/code> and <code>PlatformDocs<\/code> and cites documentation URLs.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>Cortex Search over internal data is not approved at Barclays. Knowledge extensions are built and hosted by the provider; no bank data is indexed. Finance publishers (e.g. Investopedia, FactSet) offer extensions too - personalised listings must be requested by the account admin.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE AI3: MARKETPLACE KNOWLEDGE EXTENSION (instead of Cortex Search)   (~30 min)\n-- Persona: AI Builder\n-- Question: \"Our agents need trusted unstructured knowledge, but we are not\n--            allowed to vectorise internal (PII) data yet. What can we do?\"\n-- Prereq:   Facilitator setup 00 (installs SNOWFLAKE_DOCS_CKE), DA1 (SV_CLIENT_360)\n--\n-- A Cortex Knowledge Extension (CKE) is a search service that a Marketplace\n-- provider builds, hosts and refreshes. You query it through a share - no\n-- internal data is embedded, indexed or sent to the provider.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BARCLAYS_WH;\n\n-- -----------------------------------------------------\n-- AI3.1 What did we get from the Marketplace?\n-- Snowsight: Data Products > Marketplace > search \"Cortex Knowledge Extension\"\n-- (Finance publishers such as Investopedia are listed; personalised listings\n--  must be requested by the account admin.)\n-- -----------------------------------------------------\nSHOW CORTEX SEARCH SERVICES IN DATABASE SNOWFLAKE_DOCS_CKE;\n-- Note: we did not create this service, we cannot see its source table,\n-- and we pay only for the queries we run.\n\n-- -----------------------------------------------------\n-- AI3.2 Query it directly\n-- -----------------------------------------------------\nSELECT r.value:DOCUMENT_TITLE::STRING AS TITLE,\n       r.value:SOURCE_URL::STRING     AS URL,\n       LEFT(r.value:CHUNK::STRING, 200) AS EXCERPT\nFROM TABLE(FLATTEN(PARSE_JSON(SNOWFLAKE.CORTEX.SEARCH_PREVIEW(\n        'SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE',\n        '{\"query\": \"How do I apply a masking policy to a column?\",\n          \"columns\": [\"DOCUMENT_TITLE\", \"SOURCE_URL\", \"CHUNK\"],\n          \"limit\": 3}')):results)) r;\n\n-- -----------------------------------------------------\n-- AI3.3 Combine governed internal data + external knowledge in one agent\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT\n  COMMENT = 'Barclays HOL - client data (semantic view) + Snowflake docs (Marketplace knowledge extension)'\n  PROFILE = '{\"display_name\": \"Payments Platform Copilot\", \"color\": \"orange\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: >\n      Be concise. When you use documentation, cite the source URL.\n      Never present documentation content as if it were bank data.\n    orchestration: >\n      Use Client360 for any question about our clients, payments, alerts or feedback.\n      Use PlatformDocs for how-to questions about Snowflake features\n      (Iceberg, dynamic tables, policies, semantic views, agents).\n      A question may need both, e.g. \"which clients have X, and how do I monitor that?\"\n  tools:\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: Client360\n        description: Corporate client payments health, alerts and feedback sentiment.\n    - tool_spec:\n        type: cortex_search\n        name: PlatformDocs\n        description: Official Snowflake documentation from a Marketplace Cortex Knowledge Extension.\n  tool_resources:\n    Client360:\n      semantic_view: BARCLAYS_HOL.ANALYTICS.SV_CLIENT_360\n      execution_environment:\n        type: warehouse\n        warehouse: BARCLAYS_WH\n    PlatformDocs:\n      name: SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE\n      max_results: 4\n      title_column: DOCUMENT_TITLE\n      id_column: SOURCE_URL\n  $$;\n\n-- -----------------------------------------------------\n-- AI3.4 Try it in Snowflake Intelligence (\"Payments Platform Copilot\"):\n--   \"Which 3 clients have the most open critical alerts, and how could I build\n--    a dynamic table that keeps that list up to date?\"\n--   \"How do Snowflake-managed Iceberg tables differ from ones using an external volume?\"\n-- Or from SQL:\nSELECT SNOWFLAKE.CORTEX.DATA_AGENT_RUN(\n  'SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT',\n  $${\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"Which 3 clients have the most open critical alerts, and how could I build a dynamic table to keep that list up to date?\"}]}]}$$\n) AS RESPONSE;\n-- -----------------------------------------------------\n\n-- Discussion: the same pattern works for licensed external content already\n-- used by the investment bank (LSEG, FactSet, S&P - several publish CKEs),\n-- giving retail and corporate banking AI over trusted text with no PII risk.\n\nSELECT 'AI3 complete' AS STATUS;\n", "sql_name": "vignettes/ai3_knowledge_extension/ai3.sql"}, {"code": "GOV1", "title": "Classify, tag, mask and filter PII", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Governance / Risk<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<tr><td><strong>Script<\/strong><\/td><td><span class=\"ref\"><code>gov1.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Prove account identifiers are protected wherever they flow - dashboards, semantic views, agents - and that people only see clients in their region.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>GOVERNANCE.ACCOUNT_REGISTER<\/code><\/li>\n<li>Tag <code>DATA_SENSITIVITY<\/code> with tag-based masking policy<\/li>\n<li>Row access policy <code>RAP_ACCOUNT_REGION<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<ol>\n<li>Auto-classify with <code>SYSTEM$CLASSIFY<\/code>.<\/li>\n<li>Apply the bank&#x27;s sensitivity tags.<\/li>\n<li>Attach a masking policy to the tag (protects every tagged column).<\/li>\n<li>Add a row access policy by currency/region.<\/li>\n<li>Query as builder, restricted UK desk and data owner.<\/li>\n<\/ol>\n<h3>Cortex Code prompts<\/h3>\n<ul>\n<li><em>&quot;Show me every column in BARCLAYS_HOL tagged DATA_SENSITIVITY and the masking policy protecting it.&quot;<\/em><\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>Builder sees 36 masked rows; <code>HOL_RESTRICTED<\/code> sees 23 GBP-only masked rows; <code>HOL_ADMIN<\/code> sees full IBANs.<\/p>\n<h3>Barclayflake note<\/h3>\n<p>In production, central governance applies tags and policies to the Iceberg source tables so every downstream object and agent inherits them.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE GOV1: CLASSIFY, TAG, MASK AND FILTER PII   (~45 min)\n-- Persona: Governance / Risk / Data Owner\n-- Question: \"Prove that account identifiers are protected wherever they flow -\n--            dashboards, semantic vie
